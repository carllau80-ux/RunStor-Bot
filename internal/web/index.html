  // ---- 子页: 导入文档 ----

  function renderKBImportPage() {
    const card = el("div", "inspect-form");
    card.appendChild(el("p", "muted",
      i18n.t("支持 .md / .markdown / .txt。同名文档会**替换**（改完手册重新导入是最常见的动作），每次导入都会留下记录。")));

    // 1) 浏览器本地文件: 做成显眼的主入口
    const local = el("div", "kb-section");
    local.appendChild(el("h3", null, "从本机导入"));
    const pickRow = el("div", "row");
    const pickLabel = el("label", "kb-pick primary");
    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.multiple = true;
    fileInput.accept = ".md,.markdown,.txt,text/markdown,text/plain";
    fileInput.id = "kbFiles";
    fileInput.addEventListener("change", () => {
      stageLocalFiles(Array.from(fileInput.files || []));
      fileInput.value = "";
    });
    pickLabel.appendChild(fileInput);
    pickLabel.appendChild(el("span", "kb-pick-text", "选择本地文件"));
    pickRow.appendChild(pickLabel);
    pickRow.appendChild(el("span", "muted", "可多选；也可以把文件直接拖到下面的区域"));
    local.appendChild(pickRow);

    const drop = el("div", "kb-drop");
    drop.id = "kbDrop";
    drop.appendChild(el("div", null, "把 .md 文件拖到这里松开"));
    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      drop.classList.add("over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("over");
      const files = event.dataTransfer ? Array.from(event.dataTransfer.files || []) : [];
      stageLocalFiles(files);
    });
    local.appendChild(drop);

    // 待导入清单: 先把选中的文件列出来, 让人看清要导入什么再确认
    const staged = el("div", "kb-staged");
    staged.id = "kbStaged";
    local.appendChild(staged);
    const stagedRow = el("div", "row");
    stagedRow.id = "kbStagedRow";
    local.appendChild(stagedRow);
    card.appendChild(local);

    // 2) 服务器目录
    const server = el("div", "kb-section");
    server.appendChild(el("h3", null, "从服务器目录导入"));
    if (kbState.inboxDir) {
      server.appendChild(elRaw("p", "muted", i18n.tf("只读取这个目录里的文档：{0}", kbState.inboxDir)));
      const list = el("div", "kb-inbox");
      list.id = "kbInbox";
      server.appendChild(list);
      const row = el("div", "row");
      const refresh = el("button", "ghost", "刷新列表");
      refresh.type = "button";
      refresh.addEventListener("click", () => loadKBInbox().catch(() => {}));
      row.appendChild(refresh);
      const importAll = el("button", "primary", "导入全部未导入的");
      importAll.type = "button";
      importAll.addEventListener("click", () => {
        const pending = kbState.inbox.filter((file) => !file.imported).map((file) => file.path);
        if (!pending.length) { alert("目录里没有新的文件"); return; }
        importFromInbox(pending);
      });
      row.appendChild(importAll);
      server.appendChild(row);
    } else {
      server.appendChild(el("p", "muted",
        "未配置导入目录。在 config.toml 里设置 server.kb.import_dir 指向一个目录，服务启动时会读该目录里的 .md/.markdown/.txt。"));
    }
    card.appendChild(server);

    const result = el("div", "kb-import-result");
    result.id = "kbImportResult";
    card.appendChild(result);

    // 渲染待导入清单与服务器文件列表 (放在 DOM 就位之后)
    setTimeout(() => {
      renderKBStaged();
      renderKBInbox();
    }, 0);
    return card;
  }

  // stageLocalFiles 读取本地文件并放进"待导入"清单。
  //
  // 先列出来再导入, 而不是选完就立刻导入: 一次选十几个文件时, 用户需要看到自己选了
  // 哪些、哪些超限, 再决定是否导入。
  async function stageLocalFiles(files) {
    if (!files.length) return;
    for (const file of files) {
      const item = { name: file.name, bytes: file.size, content: null, error: "" };
      if (file.size > 2 * 1024 * 1024) {
        item.error = "超过 2 MB 上限";
      } else {
        try {
          item.content = await file.text();
        } catch (error) {
          item.error = i18n.tf("读取失败：{0}", error.message);
        }
      }
      kbState.pending.push(item);
    }
    renderKBStaged();
  }

  function renderKBStaged() {
    const box = $("kbStaged");
    const row = $("kbStagedRow");
    if (!box || !row) return;
    box.textContent = "";
    row.textContent = "";
    const pending = kbState.pending;
    if (!pending.length) {
      box.appendChild(el("div", "muted", "还没有选择文件"));
      return;
    }
    pending.forEach((item, index) => {
      const line = el("div", "kb-staged-item");
      line.appendChild(elRaw("span", "kb-staged-name", item.name));
      line.appendChild(el("span", "spacer"));
      line.appendChild(el("span", "muted", formatBytes(item.bytes)));
      if (item.error) {
        line.appendChild(el("span", "kb-staged-error", item.error));
      } else {
        line.appendChild(el("span", "kb-staged-ok", "待导入"));
      }
      const remove = el("button", "del", "×");
      remove.type = "button";
      remove.title = "移出清单";
      remove.addEventListener("click", () => {
        kbState.pending.splice(index, 1);
        renderKBStaged();
      });
      line.appendChild(remove);
      box.appendChild(line);
    });

    const usable = pending.filter((item) => item.content !== null);
    const importBtn = el("button", "primary", i18n.tf("导入选中的 {0} 个文件", usable.length));
    importBtn.type = "button";
    importBtn.disabled = usable.length === 0;
    importBtn.addEventListener("click", () => {
      const documents = usable.map((item) => ({ name: item.name, content: item.content, origin: "browser" }));
      importKnowledgeDocuments(documents).then(() => {
        kbState.pending = kbState.pending.filter((item) => item.content === null);
        renderKBStaged();
      });
    });
    row.appendChild(importBtn);
    const clear = el("button", "ghost", "清空清单");
    clear.type = "button";
    clear.addEventListener("click", () => { kbState.pending = []; renderKBStaged(); });
    row.appendChild(clear);
  }

  function renderKBInbox() {
    const box = $("kbInbox");
    if (!box) return;
    box.textContent = "";
    if (!kbState.inbox.length) {
      box.appendChild(el("div", "muted", "目录里还没有可导入的文件"));
      return;
    }
    kbState.inbox.forEach((file) => {
      const line = el("div", "kb-inbox-item");
      line.appendChild(elRaw("span", "kb-inbox-name", file.path));
      line.appendChild(el("span", "spacer"));
      line.appendChild(el("span", "muted", formatBytes(file.bytes) + " · " + formatTime(file.modified)));
      if (file.imported) line.appendChild(badge("已在库中", ""));
      const one = el("button", "ghost", file.imported ? "重新导入" : "导入");
      one.type = "button";
      one.addEventListener("click", () => importFromInbox([file.path]));
      line.appendChild(one);
      box.appendChild(line);
    });
  }

  async function loadKBInbox() {
    if (!kbState.inboxDir) return;
    const payload = await api("GET", "/api/kb/inbox");
    kbState.inbox = payload.files || [];
    renderKBInbox();
  }

  async function importFromInbox(paths) {
    const result = $("kbImportResult");
    try {
      const payload = await api("POST", "/api/kb/import-path", { paths: paths });
      const imported = payload.imported || [];
      if (result) {
        result.textContent = i18n.tf("已从服务器目录导入 {0} 份：", imported.length) +
          imported.map((item) => i18n.tf("{0}（{1} 片段）", item.title, item.chunks)).join(", ");
        result.className = "kb-import-result";
      }
      await loadKnowledge();
      await loadKBInbox();
    } catch (error) {
      if (result) {
        result.textContent = i18n.tf("导入失败：{0}", error.message) +
          (error.hint ? i18n.tf("（{0}）", i18n.t(error.hint)) : "");
        result.className = "kb-import-result warn";
      }
    }
  }

  // ---- 子页: 文档与记录 ----

  function renderKBDocsPage() {
    // 两张卡片要放进同一个容器再返回: 之前只 return 了文档卡, 记录卡虽然在内存里
    // 建好了却从没进 DOM —— 表现是"记录页永远空的"。
    const page = el("div", "kb-page");

    const docsCard = el("div", "inspect-form");
    docsCard.appendChild(el("h3", null, "已导入文档"));
    docsCard.appendChild(el("p", "muted", "同名文档重新导入会替换旧版本，旧版本的去向见下面的导入记录。"));
    const list = el("div", "kb-docs");
    list.id = "kbDocs";
    docsCard.appendChild(list);

    const recordCard = el("div", "inspect-form");
    const recordHead = el("div", "row");
    recordHead.appendChild(el("h3", null, "导入记录"));
    recordHead.appendChild(el("span", "spacer"));
    const clearBtn = el("button", "ghost", "清空记录");
    clearBtn.type = "button";
    clearBtn.addEventListener("click", async () => {
      if (!confirm("清空导入记录？文档不受影响。")) return;
      try {
        await api("DELETE", "/api/kb/records");
        await loadKnowledge();
      } catch (error) { alert(error.message); }
    });
    recordHead.appendChild(clearBtn);
    recordCard.appendChild(recordHead);
    recordCard.appendChild(el("p", "muted",
      "记录每次导入的时间、来源、片段数与结果；失败也会留记录（含原因）。"));
    const records = el("div", "kb-records");
    records.id = "kbRecords";
    recordCard.appendChild(records);

    page.appendChild(docsCard);
    page.appendChild(recordCard);
    setTimeout(() => {
      renderKBDocuments();
      renderKBRecords();
    }, 0);
    return page;
  }

  function renderKBRecords() {
    const box = $("kbRecords");
    if (!box) return;
    box.textContent = "";
    if (!kbState.records.length) {
      box.appendChild(el("div", "muted", "还没有导入记录"));
      return;
    }
    kbState.records.forEach((record) => {
      const line = el("div", "kb-record" + (record.ok ? "" : " bad"));
      line.appendChild(el("span", "kb-record-time", formatTime(record.at)));
      line.appendChild(el("span", "kb-record-name", record.name));
      line.appendChild(el("span", "kb-record-origin", record.origin_label || KB_ORIGIN_LABEL[record.origin] || record.origin));
      if (record.ok) {
        line.appendChild(el("span", "kb-record-detail",
          i18n.tf("{0} · {1} 片段 · {2}", record.title || "", record.chunks || 0, formatBytes(record.bytes))));
        if (record.replaced) {
          line.appendChild(elRaw("span", "kb-record-replaced", i18n.tf("替换了《{0}》", record.replaced)));
        }
      } else {
        line.appendChild(elRaw("span", "kb-record-error", i18n.tf("失败：{0}", record.error || i18n.t("未知原因"))));
      }
      box.appendChild(line);
    });
  }

  // openDocument 取文档原文并在抽屉里打开。
  async function openDocument(id) {
    const body = $("docBody");
    const title = $("docTitle");
    const meta = $("docMeta");
    title.textContent = "…";
    meta.textContent = "";
    body.innerHTML = "";
    openDrawer("docDrawer");
    try {
      const doc = await api("GET", "/api/kb/" + encodeURIComponent(id) + "/content");
      title.textContent = doc.title || doc.source;
      meta.textContent = i18n.tf("{0} · {1} 片段 · {2}", doc.source, doc.chunks, formatBytes(doc.bytes));
      if (!doc.has_content) {
        // 早先版本导入的文档没保存原文: 如实说明并指路, 而不是显示空白
        body.appendChild(el("div", "doc-empty", i18n.t(
          "这份文档是更早的版本导入的，当时没有保存原文。重新导入一次即可在这里查看。")));
        return;
      }
      renderMarkdown(body, doc.content || "");
    } catch (error) {
      body.appendChild(elRaw("div", "doc-empty", error.message));
    }
  }

  // renderMarkdown 把 Markdown 渲染成 HTML。
  //
  // 手写而不是引库: 项目零外部依赖 (构建环境不通外网)。安全性靠**先整体转义**再套标签 ——
  // 文档是用户上传的, 里面完全可能带脚本标签; 所以先整体做 HTML 转义, 后面插入的都是
  // 本函数自己的标签, 不存在注入面 (也正因如此不再支持原始 HTML 块)。
  function renderMarkdown(container, text) {
    const escapeHTML = (value) => String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (value) => escapeHTML(value)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
    const html = [];
    let inCode = false, codeLines = [], listType = "", tableRows = [];

    const flushList = () => { if (listType) { html.push("</" + listType + ">"); listType = ""; } };
    const flushTable = () => {
      if (!tableRows.length) return;
      const rows = tableRows.map((row) => row.replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim()));
      html.push("<table>");
      rows.forEach((cells, index) => {
        // Markdown 表格的第二行是分隔行 (---), 跳过
        if (index === 1 && cells.every((cell) => /^:?-{2,}:?$/.test(cell))) return;
        const tag = index === 0 ? "th" : "td";
        html.push("<tr>" + cells.map((cell) => "<" + tag + ">" + inline(cell) + "</" + tag + ">").join("") + "</tr>");
      });
      html.push("</table>");
      tableRows = [];
    };

    for (const raw of lines) {
      const line = raw.replace(/\s+$/, "");
      if (/^\s*```/.test(line)) {
        if (inCode) { html.push("<pre><code>" + escapeHTML(codeLines.join("\n")) + "</code></pre>"); codeLines = []; inCode = false; }
        else { flushList(); flushTable(); inCode = true; }
        continue;
      }
      if (inCode) { codeLines.push(raw); continue; }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        flushList(); flushTable();
        const level = heading[1].length;
        html.push("<h" + level + ">" + inline(heading[2]) + "</h" + level + ">");
        continue;
      }
      if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) { flushList(); flushTable(); html.push("<hr>"); continue; }
      if (/^\s*>/.test(line)) { flushList(); flushTable(); html.push("<blockquote>" + inline(line.replace(/^\s*>\s?/, "")) + "</blockquote>"); continue; }
      if (/^\s*\|.*\|\s*$/.test(line)) { flushList(); tableRows.push(line.trim()); continue; }
      const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ordered || bullet) {
        flushTable();
        const wanted = ordered ? "ol" : "ul";
        if (listType !== wanted) { flushList(); html.push("<" + wanted + ">"); listType = wanted; }
        html.push("<li>" + inline((ordered || bullet)[1]) + "</li>");
        continue;
      }
      flushList(); flushTable();
      if (!line.trim()) continue;
      html.push("<p>" + inline(line) + "</p>");
    }
    flushList(); flushTable();
    if (inCode && codeLines.length) html.push("<pre><code>" + escapeHTML(codeLines.join("\n")) + "</code></pre>");
    container.innerHTML = html.join("\n");
  }

  function renderKBStats() {
    const badgeNode = $("kbStatsBadge");
    if (!badgeNode) return;
    const stats = kbState.stats || {};
    badgeNode.textContent = i18n.tf("{0} 份文档 · {1} 个片段", stats.documents || 0, stats.chunks || 0);
  }

  function renderKBDocuments() {
    const box = $("kbDocs");
    if (!box) return;
    box.textContent = "";
    if (!kbState.documents.length) {
      box.appendChild(el("div", "session-empty", "还没有导入任何文档"));
      renderKBStats();
      return;
    }

    // 已导入文档用表格: 这些是"有若干属性的条目" (来源、片段、大小、字数、时间、标记),
    // 表格能横向对齐着看, 卡片列表读起来是一段段文字。
    const wrap = el("div", "kb-table-wrap");
    const table = document.createElement("table");
    table.className = "kb-table";
    table.id = "kbTable";

    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    [
      { text: "文档", cls: "" },
      { text: "来源文件", cls: "" },
      { text: "片段", cls: "num" },
      { text: "大小", cls: "num" },
      { text: "字数", cls: "num" },
      { text: "导入时间", cls: "" },
      { text: "操作", cls: "act" },
    ].forEach((column) => {
      const cell = el("th", column.cls, column.text);
      headRow.appendChild(cell);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    kbState.documents.forEach((doc) => {
      const row = document.createElement("tr");

      // 文档名: 做成可点的按钮, 点了在页面里打开原文
      const nameCell = document.createElement("td");
      const title = elRaw("button", "kb-doc-title", doc.title);
      title.type = "button";
      title.title = i18n.t("在页面中打开");
      title.addEventListener("click", () => openDocument(doc.id).catch(() => {}));
      nameCell.appendChild(title);
      if (doc.seeded) {
        const mark = badge(i18n.t("预置"), "");
        mark.title = i18n.t("随部署预置的文档，升级时会跟随更新；重新导入同名文件即可改为自己管理");
        nameCell.appendChild(mark);
      }
      row.appendChild(nameCell);

      row.appendChild(elRaw("td", "src", doc.source));
      row.appendChild(el("td", "num", String(doc.chunks || 0)));
      row.appendChild(el("td", "num", formatBytes(doc.bytes)));
      row.appendChild(el("td", "num", doc.runes ? String(doc.runes) : "—"));
      row.appendChild(el("td", "time", formatTime(doc.added_at)));

      const actions = el("td", "act");
      const open = el("button", "ghost", i18n.t("打开"));
      open.type = "button";
      open.addEventListener("click", () => openDocument(doc.id).catch(() => {}));
      actions.appendChild(open);
      const remove = el("button", "ghost", i18n.t("删除"));
      remove.type = "button";
      remove.addEventListener("click", async () => {
        if (!confirm(i18n.tf("删除《{0}》？检索与引用都会立即不再包含它。", doc.title))) return;
        try {
          await api("DELETE", "/api/kb/" + encodeURIComponent(doc.id));
          await loadKnowledge();
        } catch (error) { alert(error.message); }
      });
      actions.appendChild(remove);
      row.appendChild(actions);

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    box.appendChild(wrap);
    renderKBStats();
  }

  function formatBytes(size) {
    if (!size && size !== 0) return "";
    if (size >= 1048576) return (size / 1048576).toFixed(1) + " MB";
    if (size >= 1024) return Math.round(size / 1024) + " KB";
    return size + " B";
  }

  function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (isNaN(date.getTime())) return String(value);
    const pad = (n) => String(n).padStart(2, "0");
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
      " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
  }

  async function loadKnowledge() {
    const payload = await api("GET", "/api/kb");
    kbState.documents = payload.documents || [];
    kbState.records = payload.records || [];
    kbState.stats = payload.stats || {};
    const dir = kbState.stats.import_dir || "";
    if (dir && dir !== kbState.inboxDir) {
      kbState.inboxDir = dir;
      // 第一次拿到目录时把文件列表也拉回来
      loadKBInbox().catch(() => {});
    } else {
      kbState.inboxDir = dir;
    }
    renderKBDocuments();
    renderKBRecords();
    if ($("kbInbox")) renderKBInbox();
  }

  async function importKnowledgeDocuments(documents) {
    const result = $("kbImportResult");
    try {
      const payload = await api("POST", "/api/kb/import", { documents: documents });
      const imported = payload.imported || [];
      const failed = payload.failed || [];
      if (result) {
        result.textContent = failed.length
          ? i18n.tf("已导入 {0} 份；{1} 份失败：", imported.length, failed.length) +
            failed.map((item) => i18n.tf("{0}（{1}）", item.name, item.error)).join("; ")
          : i18n.tf("已导入 {0} 份文档", imported.length) +
            (imported.length ? i18n.tf("：{0}", imported.map((item) => i18n.tf("{0}（{1} 片段）", item.title, item.chunks)).join(", ")) : "");
        result.className = "kb-import-result" + (failed.length ? " warn" : "");
      }
      await loadKnowledge();
    } catch (error) {
      if (result) {
        result.textContent = i18n.tf("导入失败：{0}", error.message);
        result.className = "kb-import-result warn";
      }
    }
  }

  async function askKnowledge() {
    if (kbState.busy) return;
    const question = $("kbQuestion").value.trim();
    if (!question) { alert("请先输入问题"); return; }
    kbState.lastQuestion = question;
    kbState.busy = true;
    const button = $("kbAskBtn");
    button.disabled = true;
    button.textContent = i18n.t("检索中…");
    try {
      kbState.answer = await api("POST", "/api/kb/ask", {
        question: question,
        expand: $("kbExpand") ? $("kbExpand").checked : true,
      });
      renderKBAnswer();
    } catch (error) {
      kbState.answer = { mode: "error", note: "[" + error.kind + "] " + error.message, citations: [] };
      renderKBAnswer();
    } finally {
      kbState.busy = false;
      button.disabled = false;
      button.textContent = i18n.t("提问");
    }
  }

  const KB_MODE_LABEL = {
    model: ["模型回答", "ready"],
    retrieval_only: ["仅检索模式", ""],
    no_match: ["没找到相关资料", "asking"],
    error: ["出错了", "asking"],
  };

  function renderKBAnswer() {
    const box = $("kbAnswer");
    if (!box) return;
    box.textContent = "";
    const answer = kbState.answer;
    if (!answer) return;

    const head = el("div", "row");
    const mode = KB_MODE_LABEL[answer.mode] || [answer.mode, ""];
    head.appendChild(badge(mode[0], mode[1]));
    if (answer.model) head.appendChild(badge(i18n.tf("模型 {0}", answer.model), ""));
    if (answer.elapsed_ms) head.appendChild(el("span", "muted", answer.elapsed_ms + " ms"));
    box.appendChild(head);

    if (answer.note) {
      box.appendChild(el("div", "kb-note", answer.note));
    }
    if (answer.answer) {
      const body = el("div", "kb-answer-body");
      body.textContent = plainText(answer.answer);
      box.appendChild(body);
    }
    if ((answer.expanded || []).length) {
      box.appendChild(elRaw("div", "kb-terms", i18n.tf("模型扩展的检索词：{0}", answer.expanded.join(", "))));
    }
    if ((answer.terms || []).length) {
      box.appendChild(elRaw("div", "kb-terms", i18n.tf("实际检索词：{0}", answer.terms.join(", "))));
    }
    if ((answer.citations || []).length) {
      box.appendChild(renderCitations(answer.citations));
    }
  }

  // renderCitations 渲染引用。
  //
  // 标注"已引用"很重要: 检索到 5 条而回答只用了 2 条, 读者该知道哪 2 条是依据,
  // 其余 3 条只是候选。
  function renderCitations(citations) {
    const wrap = el("div", "kb-citations");
    wrap.appendChild(el("div", "kb-citations-title", "引用的资料"));
    citations.forEach((citation) => {
      const card = el("div", "kb-citation" + (citation.cited ? " cited" : ""));
      const head = el("div", "kb-citation-head");
      head.appendChild(el("span", "kb-citation-index", "[" + citation.index + "]"));
      head.appendChild(el("span", "kb-citation-doc", plainText(citation.doc)));
      if (citation.heading) {
        head.appendChild(el("span", "kb-citation-heading", "§ " + plainText(citation.heading)));
      }
      head.appendChild(el("span", "spacer"));
      if (citation.cited) head.appendChild(badge("回答已引用", "ready"));
      head.appendChild(el("span", "muted", i18n.tf("相关度 {0}", (citation.score || 0).toFixed(1))));
      card.appendChild(head);
      card.appendChild(el("div", "kb-citation-text", plainText(citation.snippet)));
      wrap.appendChild(card);
    });
    return wrap;
  }

  function renderInspectView() {
    const box = $("inspectMessages");
    box.textContent = "";

    const wrap = el("div", "inspect-wrap");

    const form = el("div", "inspect-form");
    form.appendChild(el("h2", null, "服务器巡检"));
    form.appendChild(el("p", "muted",
      i18n.t("填目标机的地址、登录用户与密码（或私钥），系统通过 SSH 连上去检查 CPU、内存、磁盘分区、温度与严重错误日志。多台机器可用逗号或换行分隔。")));

    const warning = el("div", "warn-line");
    warning.textContent =
      i18n.t("密码只用于本次连接，不会保存、不会写进日志或巡检记录。巡检需要从本服务所在主机能 SSH 到目标机。");
    form.appendChild(warning);

    const grid = el("div", "field-grid");

    const hostsField = el("div", "field full");
    hostsField.appendChild(el("label", null, "服务器地址（多个用逗号或换行分隔）"));
    const hostsInput = document.createElement("textarea");
    hostsInput.id = "inspectHosts";
    hostsInput.rows = 3;
    hostsInput.style.minHeight = "72px";
    hostsInput.placeholder = "192.0.2.11\n192.0.2.12";
    hostsField.appendChild(hostsInput);
    grid.appendChild(hostsField);

    const userField = el("div", "field");
    userField.appendChild(el("label", null, "登录用户"));
    const userInput = document.createElement("input");
    userInput.type = "text";
    userInput.id = "inspectUser";
    userInput.placeholder = "root";
    userField.appendChild(userInput);
    grid.appendChild(userField);

    const portField = el("div", "field");
    portField.appendChild(el("label", null, "SSH 端口（默认 22）"));
    const portInput = document.createElement("input");
    portInput.type = "text";
    portInput.id = "inspectPort";
    portInput.placeholder = "22";
    portField.appendChild(portInput);
    grid.appendChild(portField);

    const passwordField = el("div", "field full");
    passwordField.appendChild(el("label", null, "密码"));
    const passwordInput = document.createElement("input");
    passwordInput.type = "password";
    passwordInput.id = "inspectPassword";
    passwordInput.placeholder = "登录密码";
    passwordInput.autocomplete = "off";
    passwordField.appendChild(passwordInput);
    grid.appendChild(passwordField);

    const keyField = el("div", "field full");
    const keyToggle = el("label", null, "或使用私钥（可选，优先于密码）");
    keyField.appendChild(keyToggle);
    const keyInput = document.createElement("textarea");
    keyInput.id = "inspectKey";
    keyInput.rows = 3;
    keyInput.style.minHeight = "72px";
    keyInput.style.fontFamily = "var(--mono)";
    keyInput.placeholder = "-----BEGIN OPENSSH PRIVATE KEY-----";
    keyField.appendChild(keyInput);
    grid.appendChild(keyField);

    form.appendChild(grid);

    const actions = el("div", "row");
    const runButton = el("button", "primary", "开始巡检");
    runButton.id = "inspectRunBtn";
    runButton.type = "button";
    runButton.addEventListener("click", runInspection);
    actions.appendChild(runButton);

    // 日志的影响分析与处置建议: 规则库总是会给结论, 这里决定要不要再让模型补长尾
    const analyzeWrap = el("label", "check-inline");
    analyzeWrap.title = "规则库认不出来的日志交给模型分析；规则结论始终保留";
    const analyzeBox = document.createElement("input");
    analyzeBox.type = "checkbox";
    analyzeBox.id = "inspectAnalyze";
    analyzeBox.checked = true;
    analyzeWrap.appendChild(analyzeBox);
    analyzeWrap.appendChild(el("span", null, "用模型分析日志"));
    actions.appendChild(analyzeWrap);
    actions.appendChild(el("span", "muted", "巡检只读取信息，不修改目标机任何配置"));
    form.appendChild(actions);

    wrap.appendChild(form);

    // 已有结果直接渲染出来 (切换视图时不丢)
    inspectState.reports.forEach((report) => wrap.appendChild(renderReport(report)));

    box.appendChild(wrap);
  }

  function renderReport(report) {
    const card = el("div", "report");

    const head = el("div", "report-head");
    head.appendChild(el("span", "target", report.target));
    head.appendChild(el("span", "spacer"));
    head.appendChild(statusBadge(report.status));
    head.appendChild(badge(report.summary || report.summary_line || ""));
    // 巡检一完成就能导出 PDF —— 报告在服务端按需生成 (同一记录永远是同一份内容)
    head.appendChild(pdfLink(report, "导出 PDF"));
    card.appendChild(head);

    const meta = el("div", "report-meta");
    if (report.error) {
      const failed = el("div", "banner err");
      failed.textContent = report.error;
      meta.appendChild(failed);
    } else {
      const bits = [];
      if (report.host_name) bits.push(i18n.tf("主机名 {0}", report.host_name));
      if (report.os) bits.push(report.os);
      if (report.kernel) bits.push(i18n.tf("内核 {0}", report.kernel));
      if (report.uptime) bits.push(i18n.tf("运行 {0}", report.uptime));
      if (bits.length) meta.appendChild(el("div", null, bits.join(" · ")));
      meta.appendChild(el("div", null,
        i18n.tf("认证 {0} · 耗时 {1} ms", i18n.tr(report.auth_mode), report.duration_ms || 0)));
      if (report.host_key_fingerprint) {
        meta.appendChild(elRaw("div", null, i18n.tf("主机指纹 {0}", report.host_key_fingerprint)));
      }
    }
    card.appendChild(meta);
    if (report.analysis) {
      card.appendChild(el("div", "report-analysis", report.analysis));
    }

    (report.findings || []).forEach((finding) => {
      const row = el("div", "finding");
      const line = el("div", "row1");
      line.appendChild(el("span", "dot " + finding.status, ""));
      line.appendChild(el("span", "name", finding.name));
      line.appendChild(el("span", "summary", finding.summary));
      row.appendChild(line);

      // 影响与处置建议: 报告里最该被照着做的部分, 放在证据上面
      if ((finding.diagnoses || []).length) {
        row.appendChild(renderDiagnoses(finding.diagnoses));
      }

      const details = finding.details || [];
      if (details.length || finding.evidence) {
        const box = document.createElement("details");
        box.appendChild(el("summary", null, "详情与原始输出"));
        if (details.length) {
          const list = el("ul");
          details.forEach((item) => list.appendChild(el("li", null, item)));
          box.appendChild(list);
        }
        if (finding.evidence) {
          const pre = el("pre", "json");
          pre.textContent = finding.evidence;
          box.appendChild(pre);
        }
        row.appendChild(box);
      }
      card.appendChild(row);
    });

    return card;
  }

  // pdfLink 生成一个"下载 PDF 报告"的入口。
  //
  // 用 <a download> 而不是 fetch + blob: 让浏览器自己处理下载, 文件名取自
  // Content-Disposition (中文名走 RFC 5987), 也顺带支持右键"另存为"。
  function pdfLink(report, label) {
    const link = document.createElement("a");
    link.className = "pdf-link";
    link.href = "/api/inspect/" + encodeURIComponent(report.id) + "/report.pdf";
    link.setAttribute("download", "");
    link.title = "导出 PDF 报告";
    link.textContent = label;
    // 点在链接上不该触发外层的"打开这条记录"
    link.addEventListener("click", (event) => event.stopPropagation());
    return link;
  }

  // renderDiagnoses 画"影响与处置建议"。
  //
  // 每条问题: 标题 + 条数与结论来源 (规则库/模型分析), 然后影响一段、编号的处置步骤,
  // 最后附一条原始日志供核对。结论来源必须显示 —— 规则结论与模型结论的可信度不同。
  // plainText 去掉模型输出里可能带的 markdown 强调/代码标记 —— 网页不渲染它们, 会原样显示
  function plainText(value) {
    return String(value == null ? "" : value).replace(/\*\*/g, "").replace(/`/g, "");
  }

  function renderDiagnoses(items) {
    const box = el("div", "diagnoses");
    box.appendChild(el("div", "diagnoses-title", "影响与处置建议"));
    items.forEach((item) => {
      const card = el("div", "diagnosis");
      const head = el("div", "diagnosis-head");
      head.appendChild(el("span", "diagnosis-name", plainText(item.title)));
      const meta = el("span", "diagnosis-meta");
      meta.textContent = i18n.tf("{0} 条 · ", item.count || 0) +
        (item.origin === "rule" ? "规则库" : item.origin === "model" ? "模型分析" : "需人工确认");
      if (item.origin === "model") meta.classList.add("model");
      head.appendChild(meta);
      card.appendChild(head);

      card.appendChild(el("div", "diagnosis-line", i18n.tf("影响：{0}", plainText(item.impact))));
      if (item.note) {
        card.appendChild(elRaw("div", "diagnosis-note", i18n.tf("说明：{0}", plainText(item.note))));
      }
      if ((item.actions || []).length) {
        card.appendChild(el("div", "diagnosis-line", "处置："));
        const list = el("ol", "diagnosis-actions");
        (item.actions || []).forEach((action) => list.appendChild(el("li", null, plainText(action))));
        box.appendChild(card);
        card.appendChild(list);
      } else {
        box.appendChild(card);
      }
      if ((item.samples || []).length) {
        card.appendChild(elRaw("div", "diagnosis-sample", i18n.tf("原始日志：{0}", plainText(item.samples[0]))));
      }
    });
    return box;
  }

  function statusBadge(status) {
    switch (status) {
      case "critical": return badge("严重", "asking");
      case "warn": return badge("告警", "asking");
      case "unknown": return badge("无法判定", "");
      default: return badge("正常", "ready");
    }
  }

  async function runInspection() {
    if (inspectState.busy) return;

    const hosts = $("inspectHosts").value.trim();
    const user = $("inspectUser").value.trim();
    const password = $("inspectPassword").value;
    const privateKey = $("inspectKey").value;
    const port = parseInt($("inspectPort").value, 10) || 0;

    if (!hosts) { alert("请填写服务器地址"); return; }
    if (!user) { alert("请填写登录用户"); return; }
    if (!password && !privateKey.trim()) { alert("请填写密码或私钥"); return; }

    inspectState.busy = true;
    const button = $("inspectRunBtn");
    button.disabled = true;
    button.textContent = i18n.t("巡检中…");

    try {
      const result = await api("POST", "/api/inspect", {
        hosts: hosts.split(/[\n,;，；]+/).map((item) => item.trim()).filter(Boolean),
        user: user,
        port: port,
        password: password,
        private_key: privateKey,
        analyze_logs: $("inspectAnalyze") ? $("inspectAnalyze").checked : true,
      });
      inspectState.reports = result.reports || [];
      renderInspectView();
      await loadInspectionHistory();
    } catch (error) {
      alert("[" + error.kind + "] " + error.message + (error.hint ? "\n" + error.hint : ""));
    } finally {
      inspectState.busy = false;
      button.disabled = false;
      button.textContent = i18n.t("开始巡检");
      // 出结果后清掉密码: 一次巡检不需要它留在页面上
      $("inspectPassword").value = "";
    }
  }

  async function loadInspectionHistory() {
    const data = await api("GET", "/api/inspect");
    inspectState.history = data.reports || [];
    renderInspectionHistory();
    $("inspectCountBadge").textContent = i18n.tf("历史 {0} 次", inspectState.history.length);
  }

  function renderInspectionHistory() {
    const box = $("inspectHistory");
    box.textContent = "";
    if (!inspectState.history.length) {
      box.appendChild(el("div", "session-empty", "暂无巡检记录"));
      return;
    }
    inspectState.history.forEach((item) => {
      const row = el("div", "history-item");
      const top = el("div", "top");
      top.appendChild(el("span", "host", item.host_name || item.host));
      top.appendChild(statusBadge(item.status));
      const remove = el("button", "del", "×");
      remove.type = "button";
      remove.title = "删除这条记录";
      remove.addEventListener("click", async (event) => {
        event.stopPropagation();
        if (!confirm("删除这条巡检记录？")) return;
        try {
          await api("DELETE", "/api/inspect/" + encodeURIComponent(item.id));
          await loadInspectionHistory();
        } catch (error) { alert(error.message); }
      });
      top.appendChild(pdfLink(item, "PDF"));
      top.appendChild(remove);
      row.appendChild(top);
      row.appendChild(el("div", "muted", item.target + " · " + item.summary));
      row.addEventListener("click", () => openInspection(item.id));
      box.appendChild(row);
    });
  }

  async function openInspection(id) {
    try {
      const report = await api("GET", "/api/inspect/" + encodeURIComponent(id));
      switchView("inspect");
      inspectState.reports = [report];
      renderInspectView();
      $("inspectMessages").scrollTop = 0;
    } catch (error) {
      alert(error.message);
    }
  }

  // ---------- 模型设置 ----------

  // openDrawer 打开其中一个抽屉 (id 省略时为模型设置); closeDrawers 关掉所有抽屉。
  function openDrawer(id) {
    const target = typeof id === "string" ? $(id) : $("drawer");
    document.querySelectorAll(".drawer").forEach((node) => node.classList.toggle("open", node === target));
    $("overlay").classList.toggle("open", Boolean(target));
  }

  function closeDrawers() {
    document.querySelectorAll(".drawer").forEach((node) => node.classList.remove("open"));
    $("overlay").classList.toggle("open", false);
  }

  function currentPreset() {
    return state.presetsByName[$("presetSelect").value] || null;
  }

  function fillFormFromPreset() {
    const preset = currentPreset();
    if (!preset) {
      $("modelInput").value = "";
      $("baseUrlInput").value = "";
      $("presetTip").textContent = i18n.t("手动填写接口地址与模型名（任何 OpenAI 兼容端点都可以）。");
      return;
    }
    if ($("modelInput").value.trim() === "" || $("modelInput").dataset.auto === "1") {
      $("modelInput").value = preset.model || "";
      $("modelInput").dataset.auto = "1";
    }
    $("baseUrlInput").value = preset.base_url || "";
    $("presetTip").textContent = preset.note ||
      (preset.base_url ? i18n.tf("接口地址已自动填好：{0}", preset.base_url) : "该厂商需要手动填写接口地址。");
  }

  function clearForm() {
    state.editingName = null;
    $("formTitle").textContent = i18n.t("添加模型");
    $("nameInput").value = "";
    $("nameInput").disabled = false;
    $("modelInput").value = "";
    $("modelInput").dataset.auto = "1";
    $("baseUrlInput").value = "";
    $("apiKeyInput").value = "";
    $("apiKeyTip").textContent =
      "密钥只保存在服务器本地（0600 权限的运行态文件），不会回显、不写入配置文件。";
    if (state.presetsByName[DEFAULT_PRESET]) {
      $("presetSelect").value = DEFAULT_PRESET;
    } else if ($("presetSelect").options.length) {
      $("presetSelect").value = $("presetSelect").options[0].value;
    }
    fillFormFromPreset();
  }

  function editProfile(profile) {
    state.editingName = profile.name;
    $("formTitle").textContent = i18n.tf("修改配置：{0}", profile.name);
    $("nameInput").value = profile.name;
    $("nameInput").disabled = true;

    let matched = CUSTOM_PRESET;
    state.presets.forEach((preset) => {
      if (preset.base_url && preset.base_url === profile.base_url) matched = preset.name;
    });
    $("presetSelect").value = matched;
    $("modelInput").value = profile.model || "";
    $("modelInput").dataset.auto = "0";
    $("baseUrlInput").value = profile.base_url || "";
    $("apiKeyInput").value = "";
    $("apiKeyTip").textContent = profile.has_key
      ? "留空表示保留已保存的密钥；填写则替换。"
      : "该配置尚未保存密钥。";
    openDrawer("drawer");
  }

  async function saveProfile() {
    const button = $("saveBtn");
    button.disabled = true;
    button.textContent = i18n.t("保存中…");
    try {
      const result = await api("POST", "/api/llm/profiles", {
        name: $("nameInput").value.trim(),
        preset: $("presetSelect").value === CUSTOM_PRESET ? "" : $("presetSelect").value,
        model: $("modelInput").value.trim(),
        base_url: $("baseUrlInput").value.trim(),
        api_key: $("apiKeyInput").value,
        activate: true,
      });
      const box = $("testResult");
      box.textContent = "";
      const lines = [i18n.tf("配置名：{0}", result.saved)];
      if (result.activate_error) lines.push(i18n.tf("启用失败：{0}", result.activate_error));
      if (result.warning) lines.push(result.warning);
      banner(box, "ok", i18n.tf("已保存并设为当前模型（{0}）", result.mode), lines);
      clearForm();
      await loadProfiles();
      await loadHealth();
    } catch (error) {
      const box = $("testResult");
      box.textContent = "";
      const lines = [];
      if (error.hint) lines.push(error.hint);
      banner(box, "err", "[" + error.kind + "] " + error.message, lines);
    } finally {
      button.disabled = false;
      button.textContent = i18n.t("保存并启用");
    }
  }

  async function deleteProfile(name) {
    if (!confirm(i18n.tf("确定删除配置 {0} 吗？其中的密钥会一并删除。", name))) return;
    try {
      await api("DELETE", "/api/llm/profiles/" + encodeURIComponent(name));
      if (state.editingName === name) clearForm();
      await loadProfiles();
      await loadHealth();
    } catch (error) {
      const box = $("testResult");
      box.textContent = "";
      const lines = [];
      if (error.hint) lines.push(error.hint);
      banner(box, "err", "[" + error.kind + "] " + error.message, lines);
    }
  }

  async function testProfile(name) {
    try {
      renderTest(await api("POST", "/api/llm/test", { profile: name, deep: true }));
    } catch (error) { alert(error.message); }
  }

  async function loadProfiles() {
    const data = await api("GET", "/api/llm/profiles");
    state.presets = data.presets || [];
    state.presetsByName = {};
    state.presets.forEach((preset) => { state.presetsByName[preset.name] = preset; });

    // 当前模型显示在顶栏的胶囊里 (所有视图都能看到), 侧栏这行只说模式, 不重复模型名。
    const pill = $("modelPillName");
    if (pill) pill.textContent = data.active || i18n.t("无");
    $("modeLine").textContent = data.mode === "demo"
      ? i18n.t("demo 模式（无需 Key）")
      : i18n.t("已接入模型");

    const select = $("presetSelect");
    const previous = select.value;
    select.textContent = "";
    state.presets.forEach((preset) => {
      const option = document.createElement("option");
      option.value = preset.name;
      option.textContent = preset.display + "（" + preset.name + "）";
      select.appendChild(option);
    });
    const custom = document.createElement("option");
    custom.value = CUSTOM_PRESET;
    custom.textContent = i18n.t("自定义 / 其他 OpenAI 兼容端点");
    select.appendChild(custom);
    if (previous) select.value = previous;
    else if (state.presetsByName[DEFAULT_PRESET]) select.value = DEFAULT_PRESET;
    if (state.editingName === null) fillFormFromPreset();

    const notice = $("runtimeNotice");
    notice.textContent = "";
    if (!data.runtime_enabled) {
      $("formBox").style.display = "none";
      banner(notice, "warn", "网页改配置已关闭",
        ["模型配置请在服务器上编辑 config.toml，或设置 server.allow_ui_config=true 后重启。"]);
    } else {
      $("formBox").style.display = "";
    }

    const list = $("profileList");
    list.textContent = "";
    (data.profiles || []).forEach((profile) => {
      const card = el("div", "profile" + (profile.is_active ? " active" : ""));
      const top = el("div", "top");
      top.appendChild(el("span", "name", profile.name));
      if (profile.is_active) top.appendChild(badge("使用中", "mode-llm"));
      top.appendChild(badge(profile.available ? "可用" : "不可用",
        profile.available ? "ready" : "asking"));
      if (profile.source === "runtime") top.appendChild(badge("网页创建"));
      else if (profile.source === "config") top.appendChild(badge("配置文件"));
      else top.appendChild(badge("内置"));
      if (profile.has_key) top.appendChild(badge("已配置 Key"));
      card.appendChild(top);

      // 每个片段单独翻译后再拼: 整句是"模型 · 地址 · Key"的形式, 拼完再翻就查不到了
      card.appendChild(elRaw("div", "detail", [
        profile.model || i18n.t("(未设 model)"),
        profile.base_url || i18n.t("(未设 base_url)"),
        i18n.tf("Key：{0}", profile.key_source || "none"),
      ].join("  ·  ")));
      if (profile.note) card.appendChild(el("div", "muted", profile.note));
      if (profile.overrides_config) {
        card.appendChild(el("div", "overridden", "同名配置文件项已被此配置覆盖"));
      }
      if (!profile.available && profile.unavailable_reason) {
        card.appendChild(elRaw("div", "unavail", i18n.tf("不可用原因：{0}", profile.unavailable_reason)));
      }

      const row = el("div", "row");

      const use = el("button", null, profile.is_active ? "已在使用" : "设为当前");
      use.type = "button";
      use.disabled = !profile.available || profile.is_active;
      use.addEventListener("click", async () => {
        try {
          const result = await api("PUT", "/api/llm/active", { profile: profile.name });
          if (result.warning) {
            const box = $("testResult");
            box.textContent = "";
            banner(box, "warn", result.warning, []);
          }
          await loadProfiles();
          await loadHealth();
        } catch (error) { alert(error.message); }
      });
      row.appendChild(use);

      const test = el("button", null, "连通性+冒烟");
      test.type = "button";
      test.addEventListener("click", async () => {
        test.disabled = true;
        test.textContent = i18n.t("测试中…");
        await testProfile(profile.name);
        test.disabled = false;
        test.textContent = i18n.t("连通性+冒烟");
      });
      row.appendChild(test);

      if (profile.editable) {
        const edit = el("button", null, "编辑");
        edit.type = "button";
        edit.addEventListener("click", () => editProfile(profile));
        row.appendChild(edit);

        const remove = el("button", null, "删除");
        remove.type = "button";
        remove.addEventListener("click", () => deleteProfile(profile.name));
        row.appendChild(remove);
      }

      card.appendChild(row);
      list.appendChild(card);
    });

    const table = $("presetTable");
    table.textContent = "";
    const head = el("tr");
    ["厂商", "base_url", "默认模型"].forEach((title) => head.appendChild(el("th", null, title)));
    table.appendChild(head);
    state.presets.forEach((preset) => {
      const row = el("tr");
      row.appendChild(el("td", null, preset.display));
      row.appendChild(el("td", "mono", preset.base_url || "(需手填)"));
      row.appendChild(el("td", "mono", preset.model || "(需手填)"));
      table.appendChild(row);
    });
  }

  function renderTest(result) {
    const box = $("testResult");
    box.textContent = "";
    const label = result.profile ? i18n.tf("配置 {0}", result.profile) : "当前配置";
    if (result.ok) {
      const lines = [i18n.tf("耗时 {0} ms", result.elapsed_ms)];
      if (result.model) lines.push(i18n.tf("模型 {0}", result.model));
      if (result.reply) lines.push(i18n.tf("回复：{0}", result.reply));
      if (result.json_mode !== undefined) {
        lines.push(i18n.tf("结构化输出 {0}", result.json_mode ? i18n.t("支持") : i18n.t("不支持（已自动降级）")));
      }
      const smoke = result.smoke;
      if (smoke) {
        lines.push(smoke.ok ? i18n.t("抽取冒烟：通过") : i18n.tf("抽取冒烟：未通过 —— {0}", smoke.message || ""));
        if (smoke.kind) {
          lines.push(i18n.tf("冒烟识别：{0}", smoke.kind) + " / " +
            (smoke.frequency || "-") + " / " + (smoke.time || "-"));
        }
      }
      banner(box, "ok", i18n.tf("{0} 测试通过", label), lines);
    } else {
      const error = result.error || {};
      const lines = [];
      if (error.hint) lines.push(error.hint);
      if (result.smoke && result.smoke.message) lines.push(result.smoke.message);
      banner(box, "err",
        label + "：[" + (error.kind || "unknown") + "] " + (error.message || "测试失败"), lines);
    }
  }

  async function loadHealth() {
    const health = await api("GET", "/health");
    $("driverBadge").textContent = i18n.tf("引擎：{0}", (health.drivers || []).join(" / "));

    // 清单来源要显眼: 用户得知道候选值是环境里真实存在的, 还是内置的通用取值
    const info = health.catalog || {};
    const badge = $("catalogBadge");
    if (info.from_api) {
      badge.textContent = i18n.tf("清单：运行时接口（{0} 应用 / {1} 介质）",
        info.applications || 0, info.media_servers || 0);
      badge.className = "badge mode-llm";
    } else {
      badge.textContent = i18n.t("清单：内置");
      badge.className = "badge mode-demo";
      badge.title = info.warning || "未配置清单接口";
    }
    renderCatalogBox(info);
  }

  function renderCatalogBox(info) {
    const box = $("catalogBox");
    box.textContent = "";

    const lines = [
      i18n.tf("来源：{0}", info.from_api ? i18n.t("运行时接口") : i18n.t("内置清单")),
      i18n.tf("应用：{0} 个  ·  介质服务器：{1} 个", info.applications || 0, info.media_servers || 0),
    ];
    const kind = info.from_api ? "ok" : "warn";
    const title = info.from_api ? "清单已从接口加载" : "清单为内置兜底";
    banner(box, kind, title, lines);
    if (info.warning) {
      banner(box, "warn", "说明", [info.warning]);
    }
  }

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 720) $("sidebar").classList.remove("open");
  }

  // ---------- 绑定 ----------

  $("sendBtn").addEventListener("click", send);
  $("input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });
  // autoGrow 让输入框随内容长高, 上下界都取自 CSS ——
  // 两处各写一份数字必然漂移 (改了 CSS 忘了改这里, 表现为长高后突然跳回去)。
  function autoGrow() {
    const box = $("input");
    box.style.height = "auto";
    const styles = getComputedStyle(box);
    const min = parseFloat(styles.minHeight) || 0;
    const max = parseFloat(styles.maxHeight) || 340;
    const next = Math.min(Math.max(box.scrollHeight, min), max);
    box.style.height = next + "px";
    box.style.overflowY = box.scrollHeight > max ? "auto" : "hidden";
  }
  $("input").addEventListener("input", autoGrow);

  $("newChatBtn").addEventListener("click", startNewChat);
  $("tabChat").addEventListener("click", () => switchView("chat"));
  $("tabInspect").addEventListener("click", () => switchView("inspect"));
  $("tabKB").addEventListener("click", () => switchView("kb"));
  $("resetBtn").addEventListener("click", resetCurrent);
  $("settingsBtn").addEventListener("click", () => openDrawer("drawer"));
  $("overlay").addEventListener("click", closeDrawers);

  $("presetSelect").addEventListener("change", () => {
    $("modelInput").dataset.auto = "1";
    fillFormFromPreset();
  });
  $("modelInput").addEventListener("input", () => { $("modelInput").dataset.auto = "0"; });
  $("saveBtn").addEventListener("click", saveProfile);
  $("clearFormBtn").addEventListener("click", clearForm);
  $("refreshBtn").addEventListener("click", () => { loadProfiles().catch(() => {}); });
  $("refreshCatalogBtn").addEventListener("click", async () => {
    const button = $("refreshCatalogBtn");
    button.disabled = true;
    button.textContent = i18n.t("刷新中…");
    try {
      const result = await api("POST", "/api/catalog/refresh");
      await loadHealth();
      if (result.warning) {
        const box = $("catalogBox");
        banner(box, "warn", "刷新提示", [result.warning]);
      }
    } catch (error) {
      alert(error.message);
    } finally {
      button.disabled = false;
      button.textContent = i18n.t("刷新清单");
    }
  });
  $("testBtn").addEventListener("click", async () => {
    try { renderTest(await api("POST", "/api/llm/test", { deep: true })); }
    catch (error) { alert(error.message); }
  });
  $("menuBtn").addEventListener("click", () => $("sidebar").classList.toggle("open"));
  $("docCloseBtn").addEventListener("click", closeDrawers);
  // 抽屉里按 Esc 关闭: 打开文档后最常见的动作就是"看完了关掉"
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeDrawers();
  });

  function syncMenuButton() {
    $("menuBtn").style.display = window.innerWidth <= 720 ? "" : "none";
  }
  window.addEventListener("resize", syncMenuButton);
  syncMenuButton();

  // ---------- 启动 ----------

  // initPreferences 读取本机保存的主题/语言并应用到界面。
  async function initPreferences() {
    i18n.lang = (function () {
      try { return localStorage.getItem(LANG_KEY) === "en" ? "en" : "zh"; } catch (error) { return "zh"; }
    })();
    applyTheme(currentThemeChoice());
    document.querySelectorAll("[data-theme-choice]").forEach((button) => {
      button.addEventListener("click", () => setTheme(button.dataset.themeChoice));
    });
    document.querySelectorAll("[data-lang-choice]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.langChoice === i18n.lang) return;
        setLang(button.dataset.langChoice).catch(() => {});
      });
    });
    syncLangButtons();
    // 跟随系统时要跟着系统主题变
    if (window.matchMedia) {
      const query = window.matchMedia("(prefers-color-scheme: dark)");
      const onChange = () => { if (currentThemeChoice() === "auto") applyTheme("auto"); };
      if (query.addEventListener) query.addEventListener("change", onChange);
      else if (query.addListener) query.addListener(onChange);
    }
    await loadMessages();
    applyI18n();
  }

  async function boot() {
    await initPreferences();
    renderEmptyState();
    renderHeader();
    updateComposerHint();
    $("input").focus();

    try { await loadHealth(); } catch (e) { /* 引擎清单拿不到不影响使用 */ }
    try { await loadSessions(); } catch (e) { /* 历史拿不到就当新对话 */ }
    try { await loadProfiles(); } catch (e) { $("modeLine").textContent = i18n.t("模型配置读取失败"); }
    try { await loadInspectionHistory(); } catch (e) { /* 巡检历史拿不到不影响对话 */ }
  }

  boot();
})();
</script>
</body>
</html>
