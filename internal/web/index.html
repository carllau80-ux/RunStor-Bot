<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunStor Bot</title>
<script>
// 在首次绘制前定好主题, 否则浅色用户会先看到一帧深色 (反之亦然)。
// 这也是为什么主题/语言的选择存在 localStorage 而不是服务端配置:
// 它们是"每台浏览器"的偏好, 一个人用深色不影响同事用浅色。
(function () {
  try {
    var choice = localStorage.getItem("runstor-theme") || "auto";
    var dark = choice === "dark" ||
      (choice === "auto" && window.matchMedia &&
       window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (error) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<style>
  /* 主题: 两套调色板 + 语义变量。
     语义变量 (--ok-text / --err-text / --hover …) 是给"用了颜色的地方"用的:
     只写 var(--xxx) 才能跟着主题走, 直接写 var(--warn-text) 这种字面量在浅色下会糊成一片。 */
  :root, :root[data-theme="light"] {
    --bg: #f5f7fa;
    --side: #eceff4;
    --panel: #ffffff;
    --panel-2: #f2f5f9;
    --panel-3: #e6ebf2;
    --border: #d3dae4;
    --text: #16202c;
    --muted: #5c6b7f;
    --accent: #1f6feb;
    --accent-dim: #3b82f6;
    --ok: #0f7b52;
    --warn: #a26a00;
    --err: var(--err);
    --on-accent: #ffffff;
    --hover: #e8eef7;
    --ok-text: #0a7a4d;
    --warn-text: var(--warn-text);
    --err-text: var(--err-text);
    --code-bg: #eef2f7;
    --shadow: 0 8px 24px rgba(16, 32, 56, .10);
    --overlay: rgba(20, 30, 45, .35);
    --chip-warn-bg: #fdf3d7;
    --chip-warn-border: #e0c36a;
    --chip-warn-text: #6b4e00;
    --chip-err-bg: #fdeaea;
    --chip-err-border: #e5a2a2;
    --chip-err-text: #a12626;
    --chip-ok-bg: #e7f6ee;
    --chip-ok-border: #9ed3b6;
    --chip-ok-text: #14663f;
    --chip-info-bg: #e8f1fe;
    --chip-info-border: #a8c9f5;
    --chip-info-text: #12457f;
    --chip-neutral-bg: #eef1f5;
    --chip-neutral-border: #cbd4e0;
    --chip-neutral-text: #4d5a6b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* 深色 (默认观感与之前一致) */
  :root[data-theme="dark"] {
    --bg: #0d1117;
    --side: #11161d;
    --panel: #171d26;
    --panel-2: #1e2632;
    --panel-3: var(--hover);
    --border: #262f3b;
    --text: #e4e9f0;
    --muted: #8b98a9;
    --accent: #4a9eff;
    --accent-dim: #2d5f99;
    --ok: #3ecf8e;
    --warn: #f0b429;
    --err: #f0616d;
    --on-accent: #ffffff;
    --hover: var(--hover);
    --ok-text: var(--chip-ok-text);
    --warn-text: var(--chip-warn-text);
    --err-text: var(--chip-err-text);
    --code-bg: #10161e;
    --shadow: 0 8px 24px rgba(0, 0, 0, .45);
    --overlay: rgba(0, 0, 0, .55);
    --chip-warn-bg: var(--chip-warn-bg);
    --chip-warn-border: var(--chip-warn-border);
    --chip-warn-text: var(--chip-warn-text);
    --chip-err-bg: var(--chip-err-bg);
    --chip-err-border: var(--chip-err-border);
    --chip-err-text: var(--chip-err-text);
    --chip-ok-bg: #10281f;
    --chip-ok-border: var(--chip-ok-border);
    --chip-ok-text: var(--chip-ok-text);
    --chip-info-bg: var(--chip-info-bg);
    --chip-info-border: var(--chip-info-border);
    --chip-info-text: var(--chip-info-text);
    --chip-neutral-bg: #1a222c;
    --chip-neutral-border: #33404f;
    --chip-neutral-text: #a7b3c2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  button {
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: 13px;
    padding: 7px 13px; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent-dim); background: var(--hover); }
  button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .check-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    color: var(--text); cursor: pointer; user-select: none; }
  .check-inline input { margin: 0; }

  /* 知识库 */
  .kb-subnav { display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
    border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .kb-subtab { background: transparent; border-color: transparent; color: var(--muted);
    font-size: 13px; padding: 4px 12px; border-radius: 999px; }
  .kb-subtab:hover:not(:disabled) { background: var(--panel-2); color: var(--text); border-color: transparent; }
  .kb-subtab.active { background: var(--panel-2); color: var(--text); font-weight: 600;
    border-color: var(--line); }
  .kb-section { margin-bottom: 18px; }
  .kb-section h3 { font-size: 13.5px; margin: 0 0 6px 0; }
  /* 选择本地文件: 外观就是全站的主按钮 (label 套隐藏的 file input 是标准做法,
     这样能完全控制按钮外观, 而 <input type=file> 本身没法改样式) */
  .kb-pick {
    position: relative; overflow: hidden; display: inline-flex; align-items: center;
    gap: 6px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent-dim); color: var(--on-accent);
    padding: 7px 14px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  .kb-pick:hover { background: var(--accent); }
  .kb-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .kb-pick-text { pointer-events: none; }
  /* 已导入文档: 表格 */
  .kb-table-wrap { overflow-x: auto; }
  table.kb-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.kb-table th, table.kb-table td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.kb-table th {
    font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap;
    border-bottom: 1px solid var(--line); text-transform: none;
  }
  table.kb-table tbody tr:hover { background: var(--panel-2); }
  table.kb-table td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.kb-table td.time { white-space: nowrap; color: var(--muted); }
  table.kb-table td.src { color: var(--muted); font-family: var(--mono); font-size: 11.5px;
    max-width: 260px; overflow-wrap: anywhere; }
  table.kb-table td.act { white-space: nowrap; text-align: right; }
  .kb-staged { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .kb-staged-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
  .kb-staged-name { font-weight: 600; overflow-wrap: anywhere; }
  .kb-staged-ok { color: var(--muted); }
  .kb-staged-error { color: var(--err-text); }
  .kb-inbox { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .kb-inbox-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
  .kb-inbox-name { font-family: var(--mono); overflow-wrap: anywhere; }
  .kb-records { display: flex; flex-direction: column; gap: 4px; }
  .kb-record { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; border-left: 2px solid var(--line); padding: 3px 0 3px 9px; }
  .kb-record.bad { border-left-color: var(--err); }
  .kb-record-time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kb-record-name { font-weight: 600; overflow-wrap: anywhere; }
  .kb-record-origin { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 0 7px; }
  .kb-record-detail { color: var(--muted); }
  .kb-record-replaced { color: var(--warn-text); }
  .kb-record-error { color: var(--err-text); }

  /* 知识库导入区 */
  .kb-drop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px 16px;
    color: var(--muted); font-size: 13px; margin: 6px 0 12px 0; transition: all .15s; }
  .kb-drop.over { border-color: var(--accent); background: var(--panel-2); color: var(--text); }
  .kb-file { position: relative; overflow: hidden; display: inline-flex; }
  .kb-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .kb-file span { display: inline-flex; padding: 3px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12.5px; }
  .kb-file span:hover { border-color: var(--accent); color: var(--accent); }
  .kb-import-result { font-size: 12.5px; color: var(--ok, var(--ok-text)); margin-top: 6px; }
  .kb-import-result.warn { color: var(--warn-text); }
  .kb-answer { margin-top: 10px; }
  .kb-note { font-size: 12.5px; color: var(--warn-text); margin: 6px 0; line-height: 1.55; }
  .kb-answer-body { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; margin: 6px 0 10px 0; }
  .kb-terms { font-size: 11.5px; color: var(--muted); margin: 3px 0; overflow-wrap: anywhere; }
  .kb-citations { margin-top: 10px; }
  .kb-citations-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .kb-citation { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; margin-bottom: 8px; }
  .kb-citation.cited { border-left-color: var(--accent); }
  .kb-citation-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; font-size: 12.5px; }
  .kb-citation-index { font-weight: 600; color: var(--accent); }
  .kb-citation-doc { font-weight: 600; }
  .kb-citation-heading { color: var(--muted); }
  .kb-citation-text { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.55; }
  .kb-docs { display: flex; flex-direction: column; gap: 6px; }
  .kb-doc { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kb-doc .top { display: flex; align-items: center; gap: 8px; }
  .kb-doc-title { font-weight: 600; font-size: 13px; }
  .kb-doc-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  /* 影响与处置建议 */
  .diagnoses { margin: 8px 0 2px 14px; border-left: 2px solid var(--line); padding-left: 10px; }
  .diagnoses-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .diagnosis { margin-bottom: 10px; }
  .diagnosis-head { display: flex; align-items: baseline; gap: 8px; }
  .diagnosis-name { font-weight: 600; font-size: 13px; }
  .diagnosis-meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .diagnosis-meta.model { color: var(--accent); }
  .diagnosis-line { font-size: 12.5px; margin-top: 3px; line-height: 1.55; }
  .diagnosis-note { font-size: 12px; color: var(--warn-text); margin-top: 3px; }
  .diagnosis-actions { margin: 3px 0 0 0; padding-left: 22px; font-size: 12.5px; line-height: 1.6; }
  .diagnosis-sample { font-family: var(--mono); font-size: 11px; color: var(--muted);
    margin-top: 4px; overflow-wrap: anywhere; }
  .report-analysis { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  /* 导出 PDF 的入口: 形状像按钮, 但本质是链接 (让浏览器处理下载与文件名) */
  a.pdf-link {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  a.pdf-link:hover { background: var(--panel-2); border-color: var(--accent); color: var(--accent); }
  a.pdf-link::before { content: "⤓"; font-size: 12px; opacity: .75; }
  button.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); border-color: transparent; }
  textarea, input[type=text], input[type=password], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 14px; padding: 9px 12px; width: 100%;
  }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent-dim); }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }

  /* ---------- 布局 ---------- */
  .app { display: flex; flex-direction: column; height: 100%; }
  /* 顶栏: 品牌在左, 模型 / 主题 / 语言在右 —— 所有视图都在, 窄屏也不被抽屉挡住 */
  .topbar {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .topbar .spacer { flex: 1; }
  .app-body { flex: 1; display: flex; min-height: 0; }
  .model-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    border-radius: 999px; padding: 4px 12px; max-width: 240px;
  }
  .model-pill #modelPillName {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--accent); font-weight: 600;
  }

  .sidebar {
    width: 264px; flex: 0 0 264px; border-right: 1px solid var(--border);
    background: var(--side); display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-head {
    padding: 12px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: .3px; }
  /* 分段按钮组: 一组互斥的小按钮, 选中项高亮 */
  .seg {
    display: inline-flex; align-items: stretch; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; background: var(--panel);
  }
  .seg-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; padding: 4px 7px; border: 0; border-radius: 0;
    background: transparent; color: var(--muted); font-size: 11.5px; line-height: 1;
  }
  .seg-btn + .seg-btn { border-left: 1px solid var(--border); }
  .seg-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); border-color: transparent; }
  .seg-btn.active { background: var(--panel-3); color: var(--accent); }
  .seg-btn.active:hover { background: var(--panel-3); color: var(--accent); }
  .mini-select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-family: inherit; font-size: 12px; padding: 3px 6px;
    cursor: pointer; max-width: 108px;
  }
  .mini-select:hover { border-color: var(--accent-dim); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .session-scroll { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
  .session-group { font-size: 11.5px; color: var(--muted); padding: 10px 8px 5px; }
  .session-item {
    display: block; width: 100%; text-align: left; border: 1px solid transparent;
    background: transparent; border-radius: 8px; padding: 8px 9px; margin-bottom: 2px;
    cursor: pointer;
  }
  .session-item:hover { background: var(--panel-2); }
  .session-item.active { background: var(--panel-2); border-color: var(--accent-dim); }
  .session-item .row1 { display: flex; align-items: center; gap: 6px; }
  .session-item .title {
    flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .session-item .submitted-mark { color: var(--ok); }
  .session-item .row2 {
    display: flex; align-items: center; gap: 6px; margin-top: 3px;
    font-size: 11.5px; color: var(--muted);
  }
  .session-item .del {
    border: none; background: transparent; color: var(--muted); padding: 0 4px;
    font-size: 15px; line-height: 1; opacity: 0; border-radius: 4px;
  }
  .session-item:hover .del { opacity: 1; }
  .session-item .del:hover { color: var(--err); background: transparent; }
  .session-empty { color: var(--muted); font-size: 12.5px; padding: 14px 10px; text-align: center; }

  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .chat-head .title {
    font-size: 14px; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 46vw;
  }
  .chat-head .spacer { flex: 1; }
  .badge {
    font-size: 11.5px; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  }
  .badge.mode-llm { color: var(--ok); border-color: var(--chip-ok-border); }
  .badge.mode-demo { color: var(--warn); border-color: var(--chip-warn-border); }
  .badge.kind-backup { color: var(--accent); border-color: var(--accent-dim); }
  .badge.kind-restore { color: var(--accent); border-color: var(--chip-info-border); }
  .badge.ready { color: var(--ok); border-color: var(--chip-ok-border); }
  .badge.asking { color: var(--warn); border-color: var(--chip-warn-border); }

  .messages { flex: 1; overflow-y: auto; padding: 20px; min-height: 0; }
  .thread { max-width: 860px; margin: 0 auto; }

  .msg { margin-bottom: 20px; }
  .msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .msg.user .bubble {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.agent .bubble { padding: 0; }

  .empty-state { max-width: 640px; margin: 8vh auto 0; text-align: center; }
  .empty-state h2 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  .empty-state p { margin: 0 0 22px; }
  .samples { display: flex; flex-direction: column; gap: 9px; }
  .sample {
    text-align: left; border: 1px solid var(--border); background: var(--panel);
    border-radius: 10px; padding: 11px 14px; font-size: 13.5px; line-height: 1.5;
  }
  .sample:hover { border-color: var(--accent-dim); }

  .banner { border-radius: 8px; padding: 10px 13px; margin-top: 10px; font-size: 13px; }
  .banner.warn { background: var(--chip-warn-bg); border: 1px solid var(--chip-warn-border); color: var(--chip-warn-text); }
  .banner.err { background: var(--chip-err-bg); border: 1px solid var(--chip-err-border); color: var(--chip-err-text); }
  .banner.info { background: var(--chip-info-bg); border: 1px solid var(--chip-info-border); color: var(--chip-info-text); }
  .banner.ok { background: var(--chip-ok-bg); border: 1px solid var(--chip-ok-border); color: var(--chip-ok-text); }
  .banner ul { margin: 5px 0 0; padding-left: 19px; }
  .banner li { margin: 2px 0; }

  .qlist { display: grid; gap: 10px; margin-top: 10px; }
  .q { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; }
  .q .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .q .text { font-weight: 500; }
  .q .slot { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .q .hint { color: var(--warn); font-size: 12.5px; margin-top: 4px; }
  .q .example { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .q .answering { display: flex; gap: 8px; margin-top: 9px; }
  .q .answering input { flex: 1; }
  /* 总结卡: 交付前让用户过一眼的中文清单 */
  .summary-card {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    overflow: hidden; margin-top: 6px;
  }
  .summary-card.submitted { border-color: var(--chip-ok-border); }
  /* 被更新的一版取代的旧卡: 降透明度表示只作留档 */
  .summary-card.stale { opacity: .6; }
  .summary-card.stale .summary-title::after { content: "（已被后续修改取代）"; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .summary-head {
    display: flex; align-items: center; gap: 9px; padding: 11px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .summary-head .spacer { flex: 1; }
  .summary-title { font-weight: 600; font-size: 13.5px; }
  .summary-body { padding: 4px 0; }
  .summary-row {
    display: flex; align-items: baseline; gap: 12px;
    padding: 7px 14px; border-bottom: 1px solid var(--shadow);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { flex: 0 0 108px; font-size: 12.5px; color: var(--muted); }
  .summary-value { flex: 1; font-size: 13.5px; word-break: break-word; }
  .summary-fix { flex: 0 0 auto; padding: 2px 9px; font-size: 12px; }
  .summary-fix-space { flex: 0 0 0; }
  .row-editor { flex: 1 1 100%; margin-top: 8px; }
  .row-editor .q { background: var(--panel-2); border: 1px solid var(--border); }
  .summary-warnings {
    padding: 10px 14px; border-top: 1px solid var(--border);
    background: var(--chip-warn-bg); color: var(--chip-warn-text); font-size: 12.5px;
  }
  .summary-warn-title { font-weight: 600; margin-bottom: 4px; }
  .summary-warnings ul { margin: 0; padding-left: 18px; }
  .summary-foot {
    display: flex; align-items: center; gap: 11px; padding: 11px 14px;
    border-top: 1px solid var(--border); background: var(--panel-2);
  }
  .summary-json { border-top: 1px solid var(--border); }
  .summary-json > summary {
    padding: 9px 14px; cursor: pointer; font-size: 12.5px; color: var(--muted);
    list-style: none;
  }
  .summary-json > summary::-webkit-details-marker { display: none; }
  .summary-json > summary::before { content: "▸ "; }
  .summary-json[open] > summary::before { content: "▾ "; }
  .summary-json .json-actions { display: flex; gap: 8px; padding: 0 14px 9px; }
  .summary-json pre.json { max-height: 360px; }

  /* 视图切换 */
  .view-tabs { display: flex; gap: 6px; }
  .view-tabs .tab {
    flex: 1; padding: 6px 10px; font-size: 13px; background: transparent;
    border-color: transparent; color: var(--muted);
  }
  .view-tabs .tab:hover { background: var(--panel-2); color: var(--text); border-color: transparent; }
  .view-tabs .tab.active {
    background: var(--panel-2); border-color: var(--border); color: var(--text); font-weight: 600;
  }

  /* 巡检 */
  .inspect-wrap { max-width: 900px; margin: 0 auto; }
  .inspect-form {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    padding: 16px 18px;
  }
  .inspect-form h2 { font-size: 15px; margin: 0 0 6px; }
  .inspect-form .warn-line {
    background: var(--chip-warn-bg); border: 1px solid var(--chip-warn-border); color: var(--chip-warn-text);
    border-radius: 8px; padding: 9px 12px; font-size: 12.5px; margin: 10px 0 14px;
  }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .field-grid .full { grid-column: 1 / -1; }
  @media (max-width: 640px) { .field-grid { grid-template-columns: 1fr; } }

  .report {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    margin-top: 16px; overflow: hidden;
  }
  .report-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 15px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .report-head .target { font-weight: 600; }
  .report-head .spacer { flex: 1; }
  .report-meta { padding: 9px 15px; font-size: 12.5px; color: var(--muted); }
  .report-meta div { margin: 2px 0; }
  .report-failed { padding: 14px 15px; }
  .finding { border-top: 1px solid var(--shadow); padding: 10px 15px; }
  .finding .row1 { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .finding .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .finding .dot.ok { background: var(--ok); }
  .finding .dot.warn { background: var(--warn); }
  .finding .dot.critical { background: var(--err); }
  .finding .dot.unknown { background: var(--muted); }
  .finding .name { font-size: 13.5px; font-weight: 600; }
  .finding .summary { flex: 1; font-size: 13px; }
  .finding details { margin-top: 6px; }
  .finding details > summary {
    cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none;
  }
  .finding details > summary::-webkit-details-marker { display: none; }
  .finding details > summary::before { content: "▸ "; }
  .finding details[open] > summary::before { content: "▾ "; }
  .finding ul { margin: 5px 0 0; padding-left: 20px; font-size: 12.5px; }
  .finding li { margin: 2px 0; color: var(--muted); }
  .finding pre { margin: 6px 0 0; font-size: 12px; max-height: 240px; }
  .history-item {
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2);
    padding: 9px 11px; margin-bottom: 7px; cursor: pointer; font-size: 12.5px;
  }
  .history-item:hover { border-color: var(--accent-dim); }
  .history-item .top { display: flex; align-items: center; gap: 7px; }
  .history-item .host { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 分步追问: 一次一题, 左右切换 */
  .stepper {
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
    margin-top: 10px; overflow: hidden;
  }
  .stepper.flash, .qlist .q.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--hover); }
  .step-head {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .step-head .spacer { flex: 1; }
  .step-counter { font-size: 12.5px; color: var(--muted); }
  .step-dots { display: flex; gap: 5px; }
  .step-dots .dot {
    width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 11.5px;
    color: var(--muted); background: transparent;
  }
  .step-dots .dot.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--on-accent);
  }
  .step-body { min-height: 140px; }
  .step-body .q { background: transparent; border: none; border-radius: 0; }
  .step-foot {
    display: flex; align-items: center; gap: 9px; padding: 10px 14px;
    border-top: 1px solid var(--border); background: var(--panel-2);
  }
  .step-foot .spacer { flex: 1; }
  .step-foot button:disabled { opacity: .35; }

  .q .opt-label { font-size: 12px; color: var(--muted); margin-top: 9px; }
  .q .choices { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .q .choices button { padding: 4px 11px; font-size: 12.5px; }
  .q .choices button:hover { border-color: var(--accent); color: var(--on-accent); background: var(--accent-dim); }
  .q .answering input::placeholder { color: var(--muted); }
  .q.static { background: transparent; border-color: transparent; padding: 4px 0; }

  .plan-card { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; margin-top: 4px; }
  .plan-head {
    display: flex; align-items: center; gap: 10px; padding: 11px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .plan-head .spacer { flex: 1; }
  pre.json {
    margin: 0; background: var(--bg); padding: 14px; overflow: auto;
    max-height: 420px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
  }

  .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px 16px; }
  .composer-inner { max-width: 860px; margin: 0 auto; }
  /* 输入框默认给足高度: 需求描述往往是一整句话, 只露两行时看不全,
     边写边往上滚很别扭。上限用 vh 兜一层, 免得在矮屏上把对话区挤没。 */
  .composer textarea {
    min-height: 116px; max-height: min(340px, 38vh);
    resize: none; line-height: 1.6;
  }
  .composer-foot { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .composer-foot .spacer { flex: 1; }
  .composer select { width: auto; font-size: 12.5px; padding: 5px 9px; }

  /* ---------- 设置抽屉 ---------- */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 20; }
  .overlay.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 95vw);
    background: var(--panel); border-left: 1px solid var(--border);
    padding: 20px; overflow-y: auto; z-index: 21;
    transform: translateX(100%); transition: transform .2s;
  }
  .drawer.open { transform: none; }
  .drawer h2 { margin-top: 0; font-size: 15px; }
  .drawer h3 { font-size: 13.5px; margin: 0 0 12px; }
  .form-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
  .doc-drawer { width: min(720px, 96vw); padding: 0; display: flex; flex-direction: column; }
  .doc-head {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .doc-head h2 { margin: 0 0 3px; font-size: 15px; }
  .doc-head .spacer { flex: 1; }
  /* Markdown 排版: 只覆盖几种基本块, 与界面同一套配色变量 */
  .doc-body { padding: 18px 20px 40px; overflow-y: auto; font-size: 13.5px; line-height: 1.75; }
  .doc-body h1 { font-size: 19px; margin: 4px 0 12px; }
  .doc-body h2 { font-size: 16px; margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .doc-body h3 { font-size: 14.5px; margin: 18px 0 8px; }
  .doc-body h4, .doc-body h5, .doc-body h6 { font-size: 13.5px; margin: 15px 0 6px; }
  .doc-body p { margin: 9px 0; }
  .doc-body ul, .doc-body ol { margin: 8px 0; padding-left: 22px; }
  .doc-body li { margin: 3px 0; }
  .doc-body code { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg);
    border-radius: 4px; padding: 1px 5px; }
  .doc-body pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 13px; overflow-x: auto; margin: 11px 0; }
  .doc-body pre code { background: transparent; padding: 0; font-size: 12.5px; line-height: 1.6; }
  .doc-body blockquote { margin: 11px 0; padding: 3px 0 3px 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .doc-body hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  .doc-body a { color: var(--accent); }
  .doc-body table { border-collapse: collapse; margin: 11px 0; font-size: 12.5px; }
  .doc-body th, .doc-body td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .doc-body th { background: var(--panel-2); }
  .doc-empty { padding: 30px 20px; color: var(--muted); }
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field .tip { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .field-row { display: flex; gap: 10px; }
  .field-row > .field { flex: 1; }
  .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 11px; }
  .profile { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 9px; background: var(--panel-2); }
  .profile.active { border-color: var(--accent); }
  .profile .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .profile .name { font-weight: 600; }
  .profile .detail { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  .profile .unavail { color: var(--warn); font-size: 12.5px; margin-top: 6px; }
  .profile .overridden { color: var(--muted); font-size: 12px; margin-top: 4px; }
  table.presets { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.presets th, table.presets td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.presets th { color: var(--muted); font-weight: 500; }

  @media (max-width: 720px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏: 品牌在左, 模型 / 主题 / 语言在右。
       这些是"随时可能想改一下"的设置, 所以放在**所有视图都能看到**的顶栏里;
       早先它们放在左侧栏, 窄屏 (<=720px) 时侧栏变成抽屉滑出屏幕, 就够不着了。 -->
  <header class="topbar">
    <span class="brand" data-i18n="RunStor Bot">RunStor Bot</span>
    <span class="spacer"></span>
    <button class="model-pill" id="settingsBtn" title="模型设置">
      <span data-i18n="模型">模型</span>
      <span id="modelPillName">—</span>
    </button>
    <!-- 主题: 三个图标按钮 (跟随系统 / 浅色 / 深色)。
         用图标而不是下拉: 顶栏是"一眼看到当前状态"的地方, 图标比文字省地方, 也让
         三个选项同时可见 —— 下拉得点开才知道有哪几种。 -->
    <div class="seg" role="group" aria-label="主题" data-i18n-title="主题">
      <button type="button" class="seg-btn" id="themeAuto" data-theme-choice="auto"
              title="跟随系统" aria-label="跟随系统">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="seg-btn" id="themeLight" data-theme-choice="light"
              title="浅色" aria-label="浅色">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="3.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3.1 3.1l1.3 1.3M11.6 11.6l1.3 1.3M12.9 3.1l-1.3 1.3M4.4 11.6l-1.3 1.3"/>
          </g>
        </svg>
      </button>
      <button type="button" class="seg-btn" id="themeDark" data-theme-choice="dark"
              title="深色" aria-label="深色">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M13.5 10.4A6 6 0 0 1 5.6 2.5a6 6 0 1 0 7.9 7.9z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <!-- 语言: 两个按钮显示语言代号 (中 / EN)。
         语言用图标表达不出"当前是哪种", 所以这里用最短的文字代号。 -->
    <div class="seg" role="group" aria-label="语言" data-i18n-title="语言">
      <button type="button" class="seg-btn" id="langZh" data-lang-choice="zh"
              title="中文" aria-label="中文">中</button>
      <button type="button" class="seg-btn" id="langEn" data-lang-choice="en"
              title="English" aria-label="English">EN</button>
    </div>
  </header>

  <div class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="view-tabs">
        <button id="tabChat" class="tab active">对话</button>
        <button id="tabInspect" class="tab">巡检</button>
        <button id="tabKB" class="tab">知识库</button>
      </div>
      <button class="primary" id="newChatBtn">+ 新对话</button>
      <div class="muted" id="modeLine" style="font-size:12px">加载中…</div>
    </div>
    <div class="session-scroll" id="sessionScroll">
      <div class="session-empty">暂无历史对话</div>
    </div>
    <div class="session-scroll" id="inspectHistory" style="display:none"></div>
  </aside>

  <main class="chat" id="chatView">
    <div class="chat-head">
      <button class="ghost" id="menuBtn" style="display:none">☰</button>
      <span class="title" id="chatTitle">新对话</span>
      <span class="spacer"></span>
      <span class="badge" id="kindBadge" style="display:none"></span>
      <span class="badge" id="stateBadge" style="display:none"></span>
      <span class="badge" id="catalogBadge"></span>
      <span class="badge" id="driverBadge"></span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="4"
          placeholder="描述备份或恢复需求…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-foot">
          <select id="kindSelect">
            <option value="">自动识别意图</option>
            <option value="backup">备份</option>
            <option value="restore">恢复</option>
          </select>
          <span class="muted" id="composerHint">信息不完整时会逐项追问</span>
          <span class="spacer"></span>
          <button class="ghost" id="resetBtn" style="display:none">重新开始</button>
          <button class="primary" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </main>

  <main class="chat" id="inspectView" style="display:none">
    <div class="chat-head">
      <span class="title">服务器巡检</span>
      <span class="spacer"></span>
      <span class="badge" id="inspectCountBadge"></span>
    </div>
    <div class="messages" id="inspectMessages"></div>
  </main>

  <main class="chat" id="kbView" style="display:none">
    <div class="chat-head">
      <span class="title">知识库</span>
      <span class="spacer"></span>
      <span class="badge" id="kbStatsBadge"></span>
    </div>
    <div class="messages" id="kbMessages"></div>
  </main>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<!-- 文档查看: 知识库里导入的 Markdown 原文, 直接在页面里打开 -->
<aside class="drawer doc-drawer" id="docDrawer">
  <div class="doc-head">
    <div>
      <h2 id="docTitle">—</h2>
      <div class="muted" id="docMeta"></div>
    </div>
    <span class="spacer"></span>
    <button class="ghost" id="docCloseBtn" title="关闭" aria-label="关闭">✕</button>
  </div>
  <div class="doc-body" id="docBody" data-no-i18n></div>
</aside>
<aside class="drawer" id="drawer">
  <h2>应用与介质清单</h2>
  <div class="muted" style="margin-bottom:10px">
    能备份哪些应用、能备份到哪些介质服务器，由运行时接口给出（随环境变化）；接口不可用时退回内置清单，服务照常可用。
  </div>
  <div id="catalogBox"></div>
  <div class="row"><button class="small" id="refreshCatalogBtn">刷新清单</button></div>

  <h2 style="margin-top:22px">模型设置</h2>
  <div id="runtimeNotice"></div>

  <div class="form-box" id="formBox">
    <h3 id="formTitle">添加模型</h3>
    <div class="field">
      <label for="presetSelect">厂商</label>
      <select id="presetSelect"></select>
      <div class="tip" id="presetTip"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="modelInput">模型名</label>
        <input type="text" id="modelInput" placeholder="留空则用厂商默认模型">
      </div>
      <div class="field">
        <label for="nameInput">配置名（可选）</label>
        <input type="text" id="nameInput" placeholder="留空自动生成">
      </div>
    </div>
    <div class="field">
      <label for="baseUrlInput">接口地址 base_url</label>
      <input type="text" id="baseUrlInput" placeholder="https://.../v1">
    </div>
    <div class="field">
      <label for="apiKeyInput">API Key</label>
      <input type="password" id="apiKeyInput" placeholder="粘贴密钥" autocomplete="off">
      <div class="tip" id="apiKeyTip">
        密钥只保存在服务器本地（0600 权限的运行态文件），不会回显、不写入配置文件。
      </div>
    </div>
    <div class="row">
      <button class="primary" id="saveBtn">保存并启用</button>
      <button id="clearFormBtn">清空表单</button>
      <span class="spacer" style="flex:1"></span>
      <button id="testBtn">测试当前</button>
    </div>
    <div id="testResult"></div>
  </div>

  <h2 style="margin-top:20px">现有配置</h2>
  <div id="profileList"></div>
  <div class="row"><button id="refreshBtn">刷新</button></div>

  <h2 style="margin-top:22px">常见厂商预设</h2>
  <table class="presets" id="presetTable"></table>
  <div class="muted" style="margin-top:10px">
    本地模型建议 14B 以上；7B 以下抽取质量会明显下降，那种情况建议直接用 demo 模式演示。
  </div>
</aside>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const state = {
    sessionId: null,   // 当前会话; null 表示还没发送过内容的新对话
    kind: "backup",
    status: "",
    busy: false,
    stepIndex: 0,      // 分步追问当前停在第几题
    sessions: [],
    presets: [],
    presetsByName: {},
    editingName: null,
  };

  const SAMPLES = [
    "周天全备份oracle数据库，每天增量备份，oracle使用系统认证，备份整个实例，并发设置为4",
    "Oracle数据库出故障了，从生产Oracle实例周全备恢复到2026-09-25 10:30:00这个时间点，恢复到原机",
    "每天凌晨2点全量备份MySQL到本地磁盘 /u01/backup，保留30天，每周五做一次恢复演练",
  ];

  const CUSTOM_PRESET = "__custom__";
  // 默认选中的厂商。不能取列表第一项 —— 那是按字母序排的 azure_openai,
  // 而它必须手填 base_url 与模型名, 作为默认值等于让用户先撞一次墙。
  const DEFAULT_PRESET = "deepseek";

  // ---------- 通用请求 ----------

  async function api(method, path, body) {
    // 服务端消息 (报错、提示、状态标签) 也随语言走, 所以每个请求都带上 lang
    const separator = path.indexOf("?") === -1 ? "?" : "&";
    path = path + separator + "lang=" + (i18n.lang === "en" ? "en" : "zh");
    const options = { method, headers: {} };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    const text = await response.text();
    let payload = null;
    try { payload = text ? JSON.parse(text) : null; } catch (e) { payload = { raw: text }; }
    if (!response.ok) {
      const error = (payload && payload.error) || {};
      throw {
        status: response.status,
        kind: error.kind || ("http_" + response.status),
        message: error.message || i18n.tf("请求失败 ({0})", response.status),
        hint: error.hint || "",
        detail: error.detail || "",
      };
    }
    return payload;
  }

  // 所有动态内容都走 createElement + textContent, 不拼 innerHTML ——
  // 需求文本与模型输出都属于不可信输入。
  // el 建元素; 文案自动过一遍词典 (中文原文当键, 查不到就原样)。
  //
  // 自动翻译是刻意的: 界面文案绝大多数都经由 el() 落地, 在那里截一道比在每个调用点
  // 写 t("...") 少改几百处、也不会漏。反过来, **用户数据绝不能自动翻译** ——
  // 一份标题就叫"内存"的中文文档在英文界面下会被翻成 "Memory", 那就闹笑话了,
  // 所以数据用 elRaw。
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = i18n.t(text);
    return node;
  }

  // elRaw 用于用户数据 / 服务端内容 (文档标题、日志证据、主机名、模型输出…)。
  function elRaw(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    // 自标 no-i18n: 语言切换时的 DOM 遍历会跳过这个子树, 不会把用户数据当文案翻
    node.setAttribute("data-no-i18n", "");
    return node;
  }

  // ---------- 主题与语言 ----------
  //
  // 两者都存在 localStorage: 它们是"每台浏览器"的偏好, 不该由服务端配置决定
  // (一个人用深色不该影响同事用浅色)。

  const THEME_KEY = "runstor-theme";
  const LANG_KEY = "runstor-lang";

  const i18n = {
    lang: "zh",
    messages: {},
    // t 翻译一条文案 (中文原文 → 英文); 中文模式或查不到时原样返回
    t(text) {
      if (this.lang !== "en" || text === undefined || text === null) return text;
      const key = String(text);
      if (this.messages[key] !== undefined) return this.messages[key];
      // 容忍首尾空白: 代码里为拼接常写成 "· {0} 字" 或 " 吗？…", 词典里存的是干净的那份。
      // 差一个空格就静默不翻, 这种错很难靠人发现, 所以在这里抹平。
      const trimmed = key.trim();
      if (trimmed !== key && this.messages[trimmed] !== undefined) return this.messages[trimmed];
      return key;
    },
    // tf 翻译模板并按 {0} {1} 占位替换 (英文语序可以不同, 所以要整句翻译)
    tf(template, ...args) {
      let out = this.t(template);
      args.forEach((value, index) => { out = out.split("{" + index + "}").join(value); });
      return out;
    },
    // tr 只翻译词典里有的整句, 用于服务端返回的结构化文案 (检查项名、状态标签…)
    tr(text) { return this.t(text); },
  };

  function currentThemeChoice() {
    try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (error) { return "auto"; }
  }

  // resolveTheme 把"跟随系统"解析成实际的深/浅。
  function resolveTheme(choice) {
    if (choice === "dark" || choice === "light") return choice;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ? "dark" : "light";
  }

  function applyTheme(choice) {
    document.documentElement.setAttribute("data-theme", resolveTheme(choice));
    document.querySelectorAll("[data-theme-choice]").forEach((button) => {
      button.classList.toggle("active", button.dataset.themeChoice === choice);
    });
  }

  function setTheme(choice) {
    try { localStorage.setItem(THEME_KEY, choice); } catch (error) { /* 隐私模式下写不了, 不影响本次会话 */ }
    applyTheme(choice);
  }

  // applyI18n 把静态 HTML 里的文案也翻一遍。
  //
  // 动态内容在 el() 里已经翻过, 这里管的是页面自带的那部分 (标题、按钮、说明),
  // 以及 placeholder/title 这类属性。词典是"中文→英文"的, 对已经是英文的文本是
  // 无操作, 所以重复调用安全。
  function applyI18n(root) {
    const scope = root || document.body;

    // 翻译是**可逆**的: 把中文原文挂在节点上, 切回中文时还原。
    //
    // 不做这一步的话, 静态文案 (标签、按钮) 切到英文后再切回来仍是英文 —— 因为
    // 词典是"中文→英文"的单向表, 已经变成英文的文本查不到对应条目。
    const restoreText = (node) => {
      const original = node.__i18nOriginal;
      if (original === undefined) return false;
      node.nodeValue = original;
      delete node.__i18nOriginal;
      return true;
    };

    const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
    const texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach((node) => {
      const parent = node.parentElement;
      if (!parent || parent.closest("[data-no-i18n]")) return;
      const value = node.nodeValue;
      const trimmed = value.trim();
      if (!trimmed) return;
      if (i18n.lang !== "en") {
        restoreText(node);
        return;
      }
      const translated = i18n.t(trimmed);
      if (translated !== trimmed) {
        if (node.__i18nOriginal === undefined) node.__i18nOriginal = value;
        node.nodeValue = value.replace(trimmed, translated);
      }
    });

    scope.querySelectorAll("[placeholder],[title]").forEach((node) => {
      if (node.closest("[data-no-i18n]")) return;
      ["placeholder", "title"].forEach((attr) => {
        const value = node.getAttribute(attr);
        if (!value) return;
        const originals = node.__i18nAttrs || (node.__i18nAttrs = {});
        if (i18n.lang !== "en") {
          if (originals[attr] !== undefined) {
            node.setAttribute(attr, originals[attr]);
            delete originals[attr];
          }
          return;
        }
        const translated = i18n.t(value);
        if (translated !== value) {
          if (originals[attr] === undefined) originals[attr] = value;
          node.setAttribute(attr, translated);
        }
      });
    });

    document.documentElement.lang = i18n.lang === "en" ? "en" : "zh-CN";
    document.title = i18n.lang === "en"
      ? "RunStor Bot · Backup & Restore Policy Agent"
      : "RunStor Bot · 备份恢复策略 Agent";
  }

  async function loadMessages() {
    if (i18n.lang !== "en") { i18n.messages = {}; return; }
    try {
      const payload = await api("GET", "/api/i18n?lang=en");
      i18n.messages = payload.messages || {};
    } catch (error) {
      // 拿不到词典就退回中文原文: 界面仍然是可用的, 只是没翻译
      i18n.messages = {};
    }
  }

  // syncLangButtons 高亮当前语言的按钮。
  function syncLangButtons() {
    document.querySelectorAll("[data-lang-choice]").forEach((button) => {
      button.classList.toggle("active", button.dataset.langChoice === i18n.lang);
    });
  }

  // setLang 切换语言: 记住选择 → 取词典 → 重画当前视图。
  async function setLang(lang) {
    i18n.lang = lang === "en" ? "en" : "zh";
    try { localStorage.setItem(LANG_KEY, i18n.lang); } catch (error) { /* 同上 */ }
    await loadMessages();
    syncLangButtons();
    applyI18n();
    // 服务端返回的文案也要跟着换, 所以重画一遍当前视图
    switchView(typeof inspectState !== "undefined" ? inspectState.view : "chat");
    renderHeader();
  }

  function badge(text, className) {
    return el("span", "badge " + (className || ""), text);
  }

  function banner(container, type, title, lines) {
    if (!lines || !lines.length) return null;
    const box = el("div", "banner " + type);
    box.appendChild(el("div", null, title));
    const list = el("ul");
    lines.forEach((line) => list.appendChild(el("li", null, line)));
    box.appendChild(list);
    container.appendChild(box);
    return box;
  }

  function setBusy(busy) {
    state.busy = busy;
    $("sendBtn").disabled = busy;
    $("sendBtn").textContent = busy ? "处理中…" : "发送";
  }

  function scrollToBottom() {
    const box = $("messages");
    box.scrollTop = box.scrollHeight;
  }

  // focusQuestions 把当前待作答的问题带到视野里。
  //
  // 有题时绝不滚到底部: 那样用户得往回翻才能找到下一题 (上下列表时代就是这么别扭的)。
  // 没有待作答的问题了才滚到底部, 那时底部就是要交付的计划。
  function focusQuestions() {
    const box = $("messages");
    const target = box.querySelector(".stepper") || box.querySelector(".qlist .q");
    if (!target) { scrollToBottom(); return; }
    target.scrollIntoView({ block: "center" });
    target.classList.add("flash");
    setTimeout(() => target.classList.remove("flash"), 1400);
  }

  // ---------- 渲染: 一轮对话 ----------

  function messageBlock(role, label) {
    const wrap = el("div", "msg " + role);
    wrap.appendChild(el("div", "who", label));
    const bubble = el("div", "bubble");
    wrap.appendChild(bubble);
    $("messages").appendChild(wrap);
    return bubble;
  }

  function renderUserText(text, label) {
    const bubble = messageBlock("user", label || "你");
    bubble.textContent = text;
    return bubble;
  }

  // renderAgentTurn 渲染一个 agent 回合。answerable=true 时问题可作答。
  function renderAgentTurn(turn, answerable, stepIndex) {
    const bubble = messageBlock("agent", "Agent");

    const head = el("div");
    head.style.display = "flex";
    head.style.gap = "8px";
    head.style.flexWrap = "wrap";
    head.appendChild(badge(turn.kind === "restore" ? "恢复计划" : "备份计划",
      turn.kind === "restore" ? "kind-restore" : "kind-backup"));
    const pending = (turn.questions || []).length;
    head.appendChild(badge(
      turn.status === "ready" ? "信息完整" : i18n.tf("待补充 {0} 项", pending),
      turn.status === "ready" ? "ready" : "asking"));
    if (turn.confidence) {
      head.appendChild(badge(i18n.tf("置信度 {0}%", Math.round(turn.confidence * 100))));
    }
    if (turn.llm) head.appendChild(badge(i18n.tf("引擎 {0}", turn.llm)));
    if (turn.turns) head.appendChild(badge(i18n.tf("第 {0} 轮", turn.turns)));
    bubble.appendChild(head);

    banner(bubble, "err", "存在无法自动修复的问题（可换能力更强的模型后重试）", turn.errors);
    banner(bubble, "warn", "提示与风险", turn.warnings);
    banner(bubble, "info", "处理过程", turn.notices);

    const questions = turn.questions || [];
    if (questions.length) bubble.appendChild(renderQuestions(questions, answerable, stepIndex));
    return bubble;
  }

  // renderQuestions 渲染追问卡片: 先给推荐选择, 再留自定义输入。
  //
  // 推荐值来自后端槽位表 (choices 是封闭候选, suggestions 是常用值), 前端不硬编码 ——
  // 否则新增引擎时两边会各写一份, 迟早不一致。
  // renderQuestions 渲染追问。
  //
  // 可作答时用"左右分步"而不是上下长列表: 一次只看一题, 可上一题/下一题退回。
  // 上下列表的问题在于一条回答提交后整个列表会重排, 用户得往回滚才能找到下一题;
  // 分步之后"下一题"由控件接管, 位置始终明确。
  function renderQuestions(questions, answerable, stepIndex) {
    if (!answerable) return renderQuestionList(questions);
    if (questions.length === 1) {
      const list = el("div", "qlist");
      list.appendChild(renderQuestionCard(questions[0]));
      return list;
    }
    return renderQuestionStepper(questions, stepIndex);
  }

  // renderQuestionList 是历史轮次的只读形态: 紧凑列出, 不提供作答控件。
  function renderQuestionList(questions) {
    const list = el("div", "qlist");
    list.style.opacity = "0.75";
    questions.forEach((question) => {
      const card = el("div", "q static");
      const head = el("div", "head");
      head.appendChild(el("span", "text", question.question));
      head.appendChild(elRaw("span", "slot", question.slot));
      if (question.scope) head.appendChild(el("span", "muted", "(" + question.scope + ")"));
      card.appendChild(head);
      if (question.example) card.appendChild(elRaw("div", "example", i18n.tf("示例：{0}", question.example)));
      list.appendChild(card);
    });
    return list;
  }

  // renderQuestionCard 渲染单个可作答的问题卡: 推荐选择 + 自定义输入。
  function renderQuestionCard(question) {
    const card = el("div", "q");
    card.dataset.slot = question.slot;

    const head = el("div", "head");
    head.appendChild(el("span", "text", question.question));
    head.appendChild(el("span", "slot", question.slot));
    if (question.scope) head.appendChild(el("span", "muted", "(" + question.scope + ")"));
    card.appendChild(head);

    if (question.hint) card.appendChild(elRaw("div", "hint", question.hint));

    const choices = question.choices || [];
    const suggestions = question.suggestions || [];
    const options = choices.concat(suggestions);

    if (options.length) {
      card.appendChild(el("div", "opt-label",
        choices.length ? "选择一项（也可以自己填写）" : "常用值（也可以自己填写）"));
      const row = el("div", "choices");
      options.forEach((option) => {
        const button = el("button", null, option);
        button.type = "button";
        // 点推荐值直接提交 —— 它就是一个答案, 让用户点完还要再按一次提交是多余的
        button.addEventListener("click", () => sendAnswers({ [question.slot]: option }, option));
        row.appendChild(button);
      });
      card.appendChild(row);
    } else if (question.example) {
      card.appendChild(elRaw("div", "example", i18n.tf("示例：{0}", question.example)));
    }

    const row = el("div", "answering");
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = options.length
      ? "或自己填写"
      : (question.example ? i18n.tf("如 {0}", question.example) : i18n.t("请输入"));
    row.appendChild(input);

    const submit = el("button", "primary", "提交");
    submit.type = "button";
    submit.addEventListener("click", () => {
      const value = input.value.trim();
      if (!value) { input.focus(); return; }
      sendAnswers({ [question.slot]: value }, value);
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        submit.click();
      }
    });
    row.appendChild(submit);
    card.appendChild(row);
    return card;
  }

  // renderQuestionStepper 逐题展示, 带步骤指示与上一题/下一题。
  //
  // startIndex 由调用方给: 刚回答完某题时传入它原来的位置, 于是"同一位置的新题"
  // 就是下一题 —— 填过的那题会从待补充列表里消失, 列表随之前移。
  function renderQuestionStepper(questions, startIndex) {
    const wrap = el("div", "stepper");

    const head = el("div", "step-head");
    const counter = el("span", "step-counter");
    head.appendChild(counter);
    head.appendChild(el("span", "spacer"));
    const dots = el("div", "step-dots");
    head.appendChild(dots);
    wrap.appendChild(head);

    const body = el("div", "step-body");
    wrap.appendChild(body);

    const foot = el("div", "step-foot");
    const prev = el("button", null, "← 上一题");
    prev.type = "button";
    const next = el("button", null, "下一题 →");
    next.type = "button";
    foot.appendChild(prev);
    foot.appendChild(el("span", "spacer"));
    foot.appendChild(next);
    wrap.appendChild(foot);

    let index = 0;
    if (typeof startIndex === "number" && startIndex > 0) {
      index = Math.min(startIndex, questions.length - 1);
    }

    function paint() {
      counter.textContent = i18n.tf("第 {0} 题 / 共 {1}", index + 1, questions.length);

      dots.textContent = "";
      questions.forEach((item, position) => {
        const dot = el("button", "dot" + (position === index ? " active" : ""), String(position + 1));
        dot.type = "button";
        dot.title = item.question;
        dot.addEventListener("click", () => { index = position; paint(); });
        dots.appendChild(dot);
      });

      body.textContent = "";
      body.appendChild(renderQuestionCard(questions[index]));

      prev.disabled = index === 0;
      next.disabled = index === questions.length - 1;

      state.stepIndex = index;
    }

    prev.addEventListener("click", () => { if (index > 0) { index--; paint(); } });
    next.addEventListener("click", () => {
      if (index < questions.length - 1) { index++; paint(); }
    });

    paint();
    return wrap;
  }

  // renderSummary 渲染"待确认"的总结卡。
  //
  // 交付前让用户过一眼中文清单, 而不是直接扔一段 JSON: 计划里的值都是代码
  // (os_auth / whole_instance), 只有后端知道它们对应的中文标签。
  //
  // options.editable 只在最后一轮为真; 历史轮次渲染成折叠的只读形态, 免得每改一次
  // 就多出一张一模一样的卡把对话淹没。
  function renderSummary(summary, plan, options) {
    const settings = options || {};
    const card = el("div", "summary-card" + (settings.submitted ? " submitted" : ""));

    const head = el("div", "summary-head");
    head.appendChild(el("span", "summary-title", settings.submitted ? "计划已定稿" : "计划待确认"));
    head.appendChild(el("span", "spacer"));
    if (summary.confidence) {
      head.appendChild(badge(i18n.tf("置信度 {0}%", Math.round(summary.confidence * 100))));
    }
    if (settings.submitted) {
      head.appendChild(badge("已提交", "ready"));
    }
    card.appendChild(head);

    const body = el("div", "summary-body");
    summary.rows.forEach((row) => {
      body.appendChild(renderSummaryRow(row, settings));
    });
    card.appendChild(body);

    if (summary.warnings && summary.warnings.length) {
      const box = el("div", "summary-warnings");
      box.appendChild(el("div", "summary-warn-title", "提示与风险"));
      const list = el("ul");
      summary.warnings.forEach((text) => list.appendChild(elRaw("li", null, text)));
      box.appendChild(list);
      card.appendChild(box);
    }

    if (settings.editable) {
      const foot = el("div", "summary-foot");
      const submit = el("button", "primary", settings.submitted ? "已定稿" : "提交计划");
      submit.type = "button";
      submit.disabled = !!settings.submitted;
      if (!settings.submitted) {
        submit.addEventListener("click", () => submitPlan(settings.sessionId, submit));
      }
      foot.appendChild(submit);

      const hint = el("span", "muted",
        settings.submitted ? "已定稿；再次修改会使其失效" : "点任意一项右侧的「修改」可单独调整，或在下方输入框说明改动");
      foot.appendChild(hint);
      card.appendChild(foot);
    }

    // 原始 JSON 收进折叠区: 需要的人能拿到, 平时不占地方
    if (plan) {
      const details = el("details", "summary-json");
      if (!settings.editable) details.open = false;
      const summaryLine = el("summary", null, "查看 / 复制计划 JSON");
      details.appendChild(summaryLine);
      const actions = el("div", "json-actions");
      actions.appendChild(buildCopyButton(plan));
      actions.appendChild(buildDownloadButton(plan));
      details.appendChild(actions);
      const pre = el("pre", "json");
      pre.textContent = JSON.stringify(plan, null, 2);
      details.appendChild(pre);
      card.appendChild(details);
    }

    return card;
  }

  function renderSummaryRow(row, settings) {
    const line = el("div", "summary-row");

    const label = el("div", "summary-label", row.label);
    const value = el("div", "summary-value", row.value);
    line.appendChild(label);
    line.appendChild(value);

    if (settings.editable && row.slot) {
      const fix = el("button", "summary-fix", "修改");
      fix.type = "button";
      fix.addEventListener("click", () => openRowEditor(line, row, settings));
      line.appendChild(fix);
    } else {
      line.appendChild(el("div", "summary-fix-space", ""));
    }
    return line;
  }

  // openRowEditor 就地把一行换成可编辑控件。
  //
  // 修改本身走的是"提交该槽位的答案" —— 与追问完全同一条路径, 因此确定性回填、
  // 合并语义、校验都自动一致, 不需要为"修改"另写一套。
  function openRowEditor(line, row, settings) {
    if (line.dataset.editing === "1") return;
    line.dataset.editing = "1";

    const editor = el("div", "row-editor");
    const question = {
      slot: row.slot,
      question: row.label,
      choices: row.choices || [],
      suggestions: row.suggestions || [],
    };
    editor.appendChild(renderQuestionCard(question));

    const cancel = el("button", "small", "取消");
    cancel.type = "button";
    cancel.addEventListener("click", () => {
      line.dataset.editing = "";
      editor.remove();
    });
    editor.appendChild(cancel);

    line.appendChild(editor);
    const input = editor.querySelector("input");
    if (input) input.focus();
  }

  function buildCopyButton(plan) {
    const copy = el("button", "small", "复制 JSON");
    copy.type = "button";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(JSON.stringify(plan, null, 2));
        copy.textContent = i18n.t("已复制");
        setTimeout(() => { copy.textContent = i18n.t("复制 JSON"); }, 1500);
      } catch (e) { alert("浏览器拒绝了剪贴板访问，请手动选中复制"); }
    });
    return copy;
  }

  function buildDownloadButton(plan) {
    const download = el("button", "small", "下载 JSON");
    download.type = "button";
    download.addEventListener("click", () => {
      const name = String(plan.task_name || "plan").replace(/[\\/:*?"<>|\s]+/g, "_");
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = name + ".json"; link.click();
      URL.revokeObjectURL(url);
    });
    return download;
  }

  // submitPlan 定稿: 记录用户确认的就是这份 JSON。
  //
  // MVP 不执行备份, 所以"提交"的含义是确认交付物; 之后再改动会让它失效 (服务端负责)。
  async function submitPlan(sessionId, button) {
    if (!sessionId) { alert("会话已失效"); return; }
    button.disabled = true;
    button.textContent = i18n.t("提交中…");
    try {
      const result = await api("POST", "/api/sessions/" + encodeURIComponent(sessionId) + "/submit");
      renderAgentTurn({
        kind: result.kind,
        status: result.status,
        warnings: result.warnings,
        notices: result.notices,
        confidence: result.confidence,
        turns: result.turns,
        llm: result.llm,
      }, false, 0);
      if (result.summary && result.plan) {
        appendSummaryCard(result.summary, result.plan, {
          editable: true, submitted: true, sessionId: sessionId,
        });
      }
      await loadSessions();
      scrollToBottom();
    } catch (error) {
      button.disabled = false;
      button.textContent = i18n.t("提交计划");
      alert(error.message);
    }
  }

  function appendSummaryCard(summary, plan, options) {
    // 新的总结卡取代之前的: 撤掉旧卡的操作按钮并折叠。
    //
    // 否则改一次就多一张可编辑的清单, 用户面对两张几乎一样的卡分不清该改哪张 ——
    // 这也正是"上下长列表"时代的毛病, 不该在总结卡上重演。
    document.querySelectorAll(".summary-card").forEach((old) => {
      old.classList.add("stale");
      old.querySelectorAll(".summary-fix").forEach((button) => button.remove());
      const foot = old.querySelector(".summary-foot");
      if (foot) foot.remove();
      const details = old.querySelector(".summary-json");
      if (details) details.open = false;
    });

    const wrap = el("div", "msg agent");
    const bubble = el("div", "bubble");
    bubble.appendChild(renderSummary(summary, plan, options));
    wrap.appendChild(bubble);
    $("messages").appendChild(wrap);
  }

  // ---------- 渲染: 整体状态 ----------

  function renderEmptyState() {
    $("messages").textContent = "";
    const box = el("div", "empty-state");
    box.appendChild(el("h2", null, "描述你的备份或恢复需求"));
    box.appendChild(el("p", "muted",
      i18n.t("用一句中文说清楚要备什么、什么时候备、存到哪里即可。信息不完整时系统会逐项追问，补齐后输出完整 JSON。也可以随时用一句话补充。未配置模型时自动使用内置 demo 客户端，可直接体验。")));
    const samples = el("div", "samples");
    SAMPLES.forEach((sample) => {
      const button = el("button", "sample", sample);
      button.type = "button";
      button.addEventListener("click", () => {
        $("input").value = sample;
        $("input").focus();
      });
      samples.appendChild(button);
    });

    $("messages").appendChild(box);

  function currentTitle() {
    const found = state.sessions.find((item) => item.id === state.sessionId);
    return found ? found.title : (state.sessionId ? i18n.t("对话") : i18n.t("新对话"));
  }

  function renderHeader() {
    $("chatTitle").textContent = currentTitle();
    const kindBadge = $("kindBadge");
    const stateBadge = $("stateBadge");

    if (!state.sessionId) {
      kindBadge.style.display = "none";
      stateBadge.style.display = "none";
      $("resetBtn").style.display = "none";
      return;
    }
    kindBadge.style.display = "";
    kindBadge.textContent = state.kind === "restore" ? "恢复" : "备份";
    kindBadge.className = "badge " + (state.kind === "restore" ? "kind-restore" : "kind-backup");

    stateBadge.style.display = "";
    const ready = state.status === "ready";
    stateBadge.textContent = ready ? "信息完整" : "待补充";
    stateBadge.className = "badge " + (ready ? "ready" : "asking");
    $("resetBtn").style.display = "";
  }

  function updateComposerHint() {
    if (!state.sessionId) {
      $("composerHint").textContent = i18n.t("信息不完整时会逐项追问");
    } else if (state.status === "ready") {
      $("composerHint").textContent = i18n.t("计划已完成；继续输入可在此基础上修改");
    } else {
      $("composerHint").textContent = i18n.t("可直接用一句话补充，或逐项填写上面的问题");
    }
  }

  // ---------- 会话列表 ----------

  async function loadSessions() {
    const data = await api("GET", "/api/sessions");
    state.sessions = data.sessions || [];
    renderSessionList();
    renderHeader();
  }

  function renderSessionList() {
    const box = $("sessionScroll");
    box.textContent = "";
    if (!state.sessions.length) {
      box.appendChild(el("div", "session-empty", "暂无历史对话"));
      return;
    }

    // 按最后活动时间分组, 与常见对话产品的写法一致
    const now = Date.now();
    const groups = [["今天", []], ["最近 7 天", []], ["更早", []]];
    state.sessions.forEach((item) => {
      const days = (now - new Date(item.updated_at).getTime()) / 86400000;
      if (days < 1) groups[0][1].push(item);
      else if (days < 7) groups[1][1].push(item);
      else groups[2][1].push(item);
    });

    groups.forEach((pair) => {
      const label = pair[0], items = pair[1];
      if (!items.length) return;
      box.appendChild(el("div", "session-group", label));
      items.forEach((item) => {
        const row = el("div", "session-item" + (item.id === state.sessionId ? " active" : ""));
        row.addEventListener("click", () => openSession(item.id));

        const row1 = el("div", "row1");
        row1.appendChild(elRaw("span", "title", item.title));
        const remove = el("button", "del", "×");
        remove.type = "button";
        remove.title = "删除这条对话";
        remove.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteSession(item.id);
        });
        row1.appendChild(remove);
        row.appendChild(row1);

        const row2 = el("div", "row2");
        row2.appendChild(el("span", null, item.kind === "restore" ? "恢复" : "备份"));
        if (item.submitted) row2.appendChild(el("span", "submitted-mark", "· 已提交"));
        else if (item.status === "ready") row2.appendChild(el("span", null, "· 已完成"));
        else if (item.pending) row2.appendChild(el("span", null, i18n.tf("· 待补充 {0}", item.pending)));
        else row2.appendChild(el("span", null, "· 进行中"));
        row.appendChild(row2);

        box.appendChild(row);
      });
    });
  }

  async function deleteSession(id) {
    if (!confirm("删除这条对话记录？")) return;
    try {
      await api("DELETE", "/api/sessions/" + encodeURIComponent(id));
      if (state.sessionId === id) { startNewChat(); }
      await loadSessions();
    } catch (error) { alert(error.message); }
  }

  async function openSession(id) {
    if (state.busy) return;
    try {
      const detail = await api("GET", "/api/sessions/" + encodeURIComponent(id));
      state.sessionId = detail.id;
      state.kind = detail.kind || "backup";
      state.status = detail.status || "";
      renderDetail(detail);
      renderSessionList();
      renderHeader();
      updateComposerHint();
      $("input").value = "";
      autoGrow();
      $("input").focus();
      closeSidebarOnMobile();
    } catch (error) {
      alert(error.message);
      await loadSessions();
    }
  }

  // renderDetail 用会话详情重建整段对话。
  function renderDetail(detail) {
    $("messages").textContent = "";
    const transcript = detail.transcript || [];

    // 老会话可能没有逐轮记录 (升级前创建的), 用需求原文兜底
    if (!transcript.length && detail.text) {
      renderUserText(detail.text);
    }

    transcript.forEach((record, index) => {
      if (record.role === "user") {
        renderUserText(record.text || "");
        return;
      }
      const isLast = index === transcript.length - 1;
      // 最后一轮用会话级别的 questions (服务端按当前状态重新推导过), 而不是
      // 回放该轮存下的那一份 —— 否则槽位表新增推荐值后, 旧会话永远看不到。
      const lastTurn = isLast && detail.status !== "ready"
        ? Object.assign({}, record, { questions: detail.questions || record.questions })
        : record;
      renderAgentTurn(lastTurn, isLast && detail.status !== "ready", state.stepIndex);
      // 只有最后一轮给可操作的总结卡; 历史轮次折叠只读, 免得每改一次就多一张卡
      if (isLast && detail.plan && detail.summary) {
        appendSummaryCard(detail.summary, detail.plan, {
          editable: true,
          submitted: !!detail.submitted_at,
          sessionId: detail.id,
        });
      }
    });

    if (detail.status === "ready") { scrollToBottom(); } else { focusQuestions(); }
  }

  // ---------- 发送 ----------

  function startNewChat() {
    state.sessionId = null;
    state.status = "";
    state.kind = "backup";
    $("input").value = "";
    autoGrow();
    renderEmptyState();
    renderHeader();
    updateComposerHint();
    autoGrow();
    $("input").focus();
    closeSidebarOnMobile();
  }

  async function send() {
    const text = $("input").value.trim();
    if (!text || state.busy) return;
    state.stepIndex = 0;
    $("input").value = "";
    autoGrow();

    if (!state.sessionId) {
      renderUserText(text);
      setBusy(true);
      try {
        const result = await api("POST", "/api/parse", {
          text: text,
          kind: $("kindSelect").value,
        });
        adoptResult(result);
        await loadSessions();
      } catch (error) {
        renderError(error);
      } finally {
        setBusy(false);
      }
      return;
    }
    await sendFollowUp(text);
  }

  async function sendFollowUp(text) {
    renderUserText(text);
    setBusy(true);
    try {
      const result = await api("POST", "/api/clarify", {
        session_id: state.sessionId,
        text: text,
      });
      adoptResult(result);
      await loadSessions();
    } catch (error) {
      renderError(error);
    } finally {
      setBusy(false);
      scrollToBottom();
    }
  }

  async function sendAnswers(answers, displayText) {
    if (state.busy) return;
    renderUserText(displayText || Object.values(answers).join("、"), "你的回答");
    setBusy(true);
    try {
      const result = await api("POST", "/api/clarify", {
        session_id: state.sessionId,
        answers: answers,
      });
      adoptResult(result);
      await loadSessions();
    } catch (error) {
      renderError(error);
    } finally {
      setBusy(false);
      scrollToBottom();
    }
  }

  function adoptResult(result) {
    state.sessionId = result.session_id;
    state.kind = result.kind || "backup";
    state.status = result.status || "";

    renderAgentTurn({
      kind: result.kind,
      status: result.status,
      questions: result.questions,
      warnings: result.warnings,
      notices: result.notices,
      errors: result.errors,
      confidence: result.confidence,
      turns: result.turns,
      llm: result.llm,
    }, result.status !== "ready", state.stepIndex);

    if (result.status === "ready" && result.plan) {
      appendSummaryCard(result.summary, result.plan, {
        editable: true, submitted: false, sessionId: result.session_id,
      });
    }

    renderHeader();
    updateComposerHint();
    if (result.status === "ready") { scrollToBottom(); } else { focusQuestions(); }
  }

  function renderError(error) {
    const bubble = messageBlock("agent", "请求失败");
    setTimeout(scrollToBottom, 0);
    const lines = [];
    if (error.hint) lines.push(error.hint);
    if (error.detail) lines.push(error.detail);
    if (lines.length) {
      banner(bubble, "err", "[" + error.kind + "] " + error.message, lines);
      return;
    }
    const box = el("div", "banner err");
    box.textContent = "[" + error.kind + "] " + error.message;
    bubble.appendChild(box);
  }

  async function resetCurrent() {
    if (!state.sessionId) return;
    setBusy(true);
    try {
      const result = await api("POST", "/api/sessions/" + state.sessionId + "/reset");
      state.sessionId = result.session_id;
      state.status = result.status || "";
      state.kind = result.kind || "backup";
      $("messages").textContent = "";
      adoptResult(result);
      await loadSessions();
    } catch (error) {
      renderError(error);
    } finally {
      setBusy(false);
    }
  }

  // ---------- 服务器巡检 ----------

  const inspectState = { view: "chat", reports: [], history: [], busy: false };

  function switchView(view) {
    inspectState.view = view;
    const isInspect = view === "inspect";
    const isKB = view === "kb";
    $("chatView").style.display = isInspect || isKB ? "none" : "";
    $("inspectView").style.display = isInspect ? "" : "none";
    $("kbView").style.display = isKB ? "" : "none";
    $("tabChat").classList.toggle("active", !isInspect && !isKB);
    $("tabInspect").classList.toggle("active", isInspect);
    $("tabKB").classList.toggle("active", isKB);
    $("newChatBtn").style.display = isInspect || isKB ? "none" : "";
    $("modeLine").style.display = isInspect || isKB ? "none" : "";
    if (isInspect) {
      renderInspectView();
      loadInspectionHistory().catch(() => {});
    } else if (isKB) {
      renderKnowledgeView();
      loadKnowledge().catch(() => {});
    } else {
      renderSessionList();
    }
    // 侧栏内容随视图切换: 对话列表 / 巡检历史
    $("sessionScroll").style.display = isInspect ? "none" : "";
    $("inspectHistory").style.display = isInspect ? "" : "none";
    closeSidebarOnMobile();
  }

  // ---------------------------------------------------------------------
  // 知识库: 三个子页 —— 提问 / 导入文档 / 文档与记录
  //
  // 分成子页而不是一屏堆着: 导入是"偶尔做一次、要看清结果"的操作, 提问是高频操作,
  // 放一起会让提问框被导入表单挤到下面; 文档与记录则是"翻查"用的。
  // ---------------------------------------------------------------------

  const kbState = {
    page: "ask", documents: [], records: [], stats: {}, answer: null,
    inbox: [], inboxDir: "", busy: false, pending: [],
  };

  // KB_ORIGIN_LABEL 只是兜底: 正常情况用服务端给的 origin_label。
  const KB_ORIGIN_LABEL = { browser: "浏览器上传", paste: "粘贴文本", server: "服务器目录" };

  const KB_PAGES = [
    { id: "ask", label: "提问", title: "向知识库提问" },
    { id: "import", label: "导入文档", title: "导入运维手册" },
    { id: "docs", label: "文档与记录", title: "已导入文档与导入记录" },
  ];

  function renderKnowledgeView() {
    const box = $("kbMessages");

    const nav = el("div", "kb-subnav");

      const button = el("button", "kb-subtab" + (kbState.page === page.id ? " active" : ""), page.label);
      button.type = "button";
      button.id = "kbPage-" + page.id;
      button.addEventListener("click", () => {
        kbState.page = page.id;
        renderKnowledgeView();
        loadKnowledge().catch(() => {});
      });

    if (kbState.page === "import") wrap.appendChild(renderKBImportPage());

  // ---- 子页: 提问 ----

  function renderKBAskPage() {
    const card = el("div", "inspect-form");
    card.appendChild(el("p", "muted",
      "只根据已导入的文档回答，并标注引用编号；文档里没有的内容会说“没有写”，不会凭常识补。"));
